name: Deliver Backend Image

on:
  push:
    branches:
      - main
    tags: 
      - 'v*'
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '*.md'
  pull_request:           
    branches:
      - main
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release tag points to main history
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag must point to a commit in main history"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=false
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          
      - name: Update image tag in labbit-gitops
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/ktcloud4-SL/labbit-gitops.git /tmp/labbit-gitops
          cd /tmp/labbit-gitops
          # 1. Local (기존 main 코드 복원: 필수)
          TARGET_FILE="environments/local/apps/backend-values.yaml"
          if command -v yq >/dev/null 2>&1; then
            yq -i ".image.tag = \"${SHORT_TAG}\"" "$TARGET_FILE"
          else
            sed -i -E "s|([[:space:]]*tag:[[:space:]]*).*|\1\"${SHORT_TAG}\"|g" "$TARGET_FILE"
          fi
          if ! grep -q "tag: \"${SHORT_TAG}\"" "$TARGET_FILE"; then
            echo "::error::Failed to update image tag in $TARGET_FILE to $SHORT_TAG"
            exit 1
          fi
          git add "$TARGET_FILE"
          # 2. AWS Seoul (추가: 파일이 있으면 갱신)
          AWS_FILE="environments/aws-seoul/apps/backend-values.yaml"
          if [ -f "$AWS_FILE" ]; then
            if command -v yq >/dev/null 2>&1; then
              yq -i ".image.tag = \"${SHORT_TAG}\"" "$AWS_FILE"
            else
              sed -i -E "s|([[:space:]]*tag:[[:space:]]*).*|\1\"${SHORT_TAG}\"|g" "$AWS_FILE"
            fi
            if ! grep -q "tag: \"${SHORT_TAG}\"" "$AWS_FILE"; then
              echo "::error::Failed to update image tag in $AWS_FILE to $SHORT_TAG"
              exit 1
            fi
            git add "$AWS_FILE"
            echo "Updated backend tag in $AWS_FILE to $SHORT_TAG"
          fi
          # 3. AWS Migration Job (추가: 파일이 있으면 갱신)
          MIGRATE_JOB="environments/aws-seoul/apps/migration-job.yaml"
          if [ -f "$MIGRATE_JOB" ]; then
            sed -i -E "s|(image:[[:space:]]*ghcr\.io/ktcloud4-sl/backend:).*|\1${SHORT_TAG}|g" "$MIGRATE_JOB"
            if ! grep -E -q "^[[:space:]]*image:[[:space:]]*ghcr\.io/ktcloud4-sl/backend:${SHORT_TAG}([[:space:]]*|$)" "$MIGRATE_JOB"; then
              echo "::error::Failed to update migration-job image to ghcr.io/ktcloud4-sl/backend:${SHORT_TAG}"
              exit 1
            fi
            git add "$MIGRATE_JOB"
            echo "Updated migration-job image tag to $SHORT_TAG"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit (tag already up-to-date)"
          else
            git commit -m "chore(backend): [LBT-32] backend 이미지 태그 자동 업데이트 (${SHORT_TAG})"

  

            max_retries=5
            retry_count=0
            until git push origin main; do
              retry_count=$((retry_count + 1))
              if [ $retry_count -ge $max_retries ]; then
                echo "::error::Failed to push to labbit-gitops after $max_retries attempts due to concurrent pushes"
                exit 1
              fi
              echo "Push rejected due to concurrent commit. Rebase and retrying ($retry_count/$max_retries)..."
              sleep $((RANDOM % 3 + 1))
              git pull --rebase origin main
            done
            echo "Successfully pushed updated backend tag: $SHORT_TAG"
          fi