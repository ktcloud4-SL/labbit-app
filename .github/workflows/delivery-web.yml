name: Deliver Web Image

on:
  push:
    branches:
      - main
    tags: 
      - 'v*'
    paths:
      - 'web/**'
      - '.github/workflows/delivery-web.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=false
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Update image tag in labbit-gitops
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/ktcloud4-SL/labbit-gitops.git /tmp/labbit-gitops
          cd /tmp/labbit-gitops
          sed -i "s|tag: \"sha-.*\"|tag: \"${SHORT_TAG}\"|g" environments/local/apps/web-values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add environments/local/apps/web-values.yaml
            git commit -m "chore(web): [LBT-32] web 이미지 태그 자동 업데이트 (${SHORT_TAG})"
            git push origin main
          fi