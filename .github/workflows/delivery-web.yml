name: Deliver Web Image

on:
  push:
    branches:
      - main
    tags: 
      - 'v*'
    paths:
      - 'web/**'
      - '.github/workflows/delivery-web.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/delivery-web.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/web
  # LBT-181 PR #138 pins the approved connector-v0.1.0 binary SHA256 in
  # the default install path; matching/mismatching evidence accompanies that commit.
  # This public URL change requires CODEOWNER re-review before merge/publication.
  APPROVED_INSTALLER_URL: https://raw.githubusercontent.com/ktcloud4-SL/labbit-app/c91d5a4aa7a3ddfcccc1360830092829c22e569f/scripts/installer/install.sh

jobs:
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          flavor: |
            latest=false
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          # Commit-pinned script with the owner-provided binary trust baseline.
          # SaaS endpoint and real installation acceptance are separate.
          build-args: |
            VITE_LABBIT_APPROVED_INSTALLER_URL=${{ env.APPROVED_INSTALLER_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Update image tag in labbit-gitops
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/ktcloud4-SL/labbit-gitops.git /tmp/labbit-gitops
          cd /tmp/labbit-gitops
                    # 1. Local (기존 main 코드 복원: web-values.yaml)
          TARGET_FILE="environments/local/apps/web-values.yaml"
          if command -v yq >/dev/null 2>&1; then
            yq -i ".image.tag = \"${SHORT_TAG}\"" "$TARGET_FILE"
          else
            sed -i -E "s|([[:space:]]*tag:[[:space:]]*).*|\1\"${SHORT_TAG}\"|g" "$TARGET_FILE"
          fi
          if ! grep -q "tag: \"${SHORT_TAG}\"" "$TARGET_FILE"; then
            echo "::error::Failed to update image tag in $TARGET_FILE to $SHORT_TAG"
            exit 1
          fi
          git add "$TARGET_FILE"
          # 2. AWS Seoul (추가: web-values.yaml)
          AWS_FILE="environments/aws-seoul/apps/web-values.yaml"
          if [ -f "$AWS_FILE" ]; then
            if command -v yq >/dev/null 2>&1; then
              yq -i ".image.tag = \"${SHORT_TAG}\"" "$AWS_FILE"
            else
              sed -i -E "s|([[:space:]]*tag:[[:space:]]*).*|\1\"${SHORT_TAG}\"|g" "$AWS_FILE"
            fi
            if ! grep -q "tag: \"${SHORT_TAG}\"" "$AWS_FILE"; then
              echo "::error::Failed to update image tag in $AWS_FILE to $SHORT_TAG"
              exit 1
            fi
            git add "$AWS_FILE"
            echo "Updated web tag in $AWS_FILE to $SHORT_TAG"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit (tag already up-to-date)"
          else
            git commit -m "chore(web): [LBT-32] web 이미지 태그 자동 업데이트 (${SHORT_TAG})"

  

            max_retries=5
            retry_count=0
            until git push origin main; do
              retry_count=$((retry_count + 1))
              if [ $retry_count -ge $max_retries ]; then
                echo "::error::Failed to push to labbit-gitops after $max_retries attempts due to concurrent pushes"
                exit 1
              fi
              echo "Push rejected due to concurrent commit. Rebase and retrying ($retry_count/$max_retries)..."
              sleep $((RANDOM % 3 + 1))
              git pull --rebase origin main
            done
            echo "Successfully pushed updated web tag: $SHORT_TAG"
          fi

  build-and-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - profile: unconfigured
            installer_url: ''
          - profile: synthetic
            installer_url: https://installer.example.test/install.sh
          - profile: approved
            installer_url: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build PR image without publishing
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          # Test empty, synthetic, and the handed-off approved PUBLIC value.
          # No PR image is published or passed to GitOps.
          build-args: |
            VITE_LABBIT_APPROVED_INSTALLER_URL=${{ matrix.profile == 'approved' && env.APPROVED_INSTALLER_URL || matrix.installer_url }}
          push: false
          load: true
          tags: labbit-web:pr
          cache-from: type=gha,scope=web

      - name: Smoke test unprivileged Web image
        shell: bash
        env:
          EXPECTED_INSTALLER_URL: ${{ matrix.profile == 'approved' && env.APPROVED_INSTALLER_URL || matrix.installer_url }}
        run: |
          docker run -d --name labbit-web-smoke --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:18080:8080 labbit-web:pr
          trap 'docker logs labbit-web-smoke || true; docker rm -f labbit-web-smoke >/dev/null 2>&1 || true' EXIT
          test "$(docker exec labbit-web-smoke id -u)" = 101
          if [ -n "$EXPECTED_INSTALLER_URL" ]; then
            # Proves Docker ARG -> builder ENV -> actual Vite dist.
            docker exec -e INSTALLER_URL="$EXPECTED_INSTALLER_URL" labbit-web-smoke \
              sh -c 'grep -rFq -- "$INSTALLER_URL" /usr/share/nginx/html/assets'
          else
            # An empty build must not accidentally inherit either configured URL.
            for installer_url in 'https://installer.example.test/install.sh' "$APPROVED_INSTALLER_URL"; do
              if docker exec -e INSTALLER_URL="$installer_url" labbit-web-smoke \
                sh -c 'grep -rFq -- "$INSTALLER_URL" /usr/share/nginx/html/assets'; then
                echo "::error::Unconfigured PR bundle unexpectedly contains an installer URL"
                exit 1
              fi
            done
          fi
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz | grep -qx 'OK'; then
              curl -fsS http://127.0.0.1:18080/login >/dev/null
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/test)" = 404
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Reject unsafe installer Docker build argument
        if: matrix.profile == 'synthetic'
        shell: bash
        run: |
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          if docker buildx build --target builder --progress plain \
            --build-arg VITE_LABBIT_APPROVED_INSTALLER_URL=http://installer.example.test/install.sh \
            --file web/Dockerfile web >"$log_file" 2>&1; then
            echo "::error::Unsafe installer URL unexpectedly passed Docker build"
            exit 1
          fi
          if ! grep -Fq 'Invalid public VITE_LABBIT_APPROVED_INSTALLER_URL' "$log_file"; then
            cat "$log_file"
            echo "::error::Docker failed before exercising the installer URL guard"
            exit 1
          fi
