title = "Labbit Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allowlist SHA-256 source and artifact checksum manifests in historical connector evidence"
paths = [
  '''(^|/)docs/connector/evidence/.*/source-manifest\.json$''',
  '''(^|/)docs/connector/evidence/.*/artifact-checksums\.json$''',
  '''(^|/)docs/connector/evidence/.*/artifact-manifest\.json$''',
  '''(^|/)docs/connector/evidence/.*/execution-manifest\.json$''',
  '''(^|/)docs/connector/evidence/.*/candidate-files\.json$''',
  '''(^|/)docs/connector/evidence/.*/tested-source.*\.json$''',
]