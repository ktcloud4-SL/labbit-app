title = "Labbit Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  description = "Connector evidence SHA-256 checksums, not API credentials"
  condition = "AND"
  paths = ["(^|/)docs/connector/evidence/"]
  regexTarget = "match"
  regexes = [
    '''(?i)(?:\.(?:go|ts|tsx|yaml|json|txt|log|gz|md|py)|credential-tests)"\s*:\s*"[a-f0-9]{64}"'''
  ]
