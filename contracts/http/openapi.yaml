openapi: 3.1.2
info:
  title: Labbit HTTP API
  version: 0.1.5
  description: |
    Labbit Browser ↔ SaaS HTTP 계약의 기계 판독 가능한 SSOT입니다.

    이 계약은 Class, LabSpec, LabExecution, LabInstance, Operation처럼
    클라이언트가 알아야 하는 안정적인 제품 리소스만 노출합니다.
    PostgreSQL polling, SQS/Kafka, Valkey, Istio, Kubernetes workload 경계,
    향후 서비스 분리와 같은 내부 실행 기술은 HTTP 계약에 노출하지 않습니다.

    호환성 원칙:
    - 호환되지 않는 HTTP 변경은 새로운 Major API 경로에서 제공합니다.
    - v1 안에서는 기존 클라이언트를 깨지 않는 필드를 추가할 수 있으며,
      클라이언트는 사용하지 않는 응답 필드를 무시해야 합니다.
    - 리소스 ID는 내부 생성 방식을 가정하지 않는 opaque string으로 취급합니다.
    - 오래 걸리는 Provider 변경 작업은 Operation 리소스로 추적합니다.
    - 오류 code, Operation stage, lifecycle status는 향후 값이 추가될 수 있습니다.

servers:
  - url: /api/v1

tags:
  - name: Auth
    description: 로그인, 로그아웃, 현재 사용자 인증 컨텍스트
  - name: Classes
    description: 사용자가 접근할 수 있는 Class와 ClassMembership 조회
  - name: LabSpecs
    description: 실습 정의 저장과 수정. 저장만으로 Provider 리소스를 생성하지 않음
  - name: LabExecutions
    description: Class 단위 실습 실행 시작과 Cleanup
  - name: LabInstances
    description: 사용자별 실습 환경 상태 조회와 Reset
  - name: Operations
    description: Provision, Reset, Cleanup 같은 비동기 변경 작업 추적
  - name: TerminalSessions
    description: 본인 LabInstance의 Terminal 대상 VM 조회, TerminalSession 생성·종료와 Browser Terminal WSS attach token 발급
  - name: WorkspaceFiles
    description: 본인 LabInstance의 Workspace VM 파일 Tree 조회, UTF-8 text 파일 Read와 낙관적 동시성 Save
  - name: PreviewSessions
    description: |
      본인 LabInstance의 Workspace VM application port로의 PreviewSession 생성·종료와, 사용자 코드가 실행되는
      별도 Preview Origin의 Browser bootstrap·인증. PreviewSession 생성·종료는 이 API의 SaaS Origin(`/api/v1`)이고
      bootstrap·인증은 Preview Origin입니다.

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 사전 생성 Local Account로 로그인
      operationId: login
      security: []
      requestBody:
        required: true
        description: 운영자가 사전에 생성한 Local Account의 로그인 정보
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: 인증에 성공했으며 기존 값을 재사용하지 않는 새 브라우저 세션 Cookie를 발급했습니다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionSetCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 현재 로그인 세션 종료
      operationId: logout
      responses:
        '204':
          description: 현재 세션을 종료하고 세션 Cookie를 제거했습니다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionClearCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me:
    get:
      tags: [Auth]
      summary: 현재 로그인 사용자 조회
      operationId: getMe
      responses:
        '200':
          description: 현재 사용자와 소속 Organization의 안전한 인증 컨텍스트입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes:
    get:
      tags: [Classes]
      summary: 접근 가능한 Class 목록 조회
      operationId: listClasses
      responses:
        '200':
          description: 현재 사용자가 접근할 수 있는 Class 목록입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes/{classId}:
    get:
      tags: [Classes]
      summary: Class 상세와 현재 사용자 컨텍스트 조회
      operationId: getClass
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: Class 상세, 현재 사용자의 역할, 활성 실습 실행과 자신의 실습 환경 요약입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            요청한 classId에 해당하는 Class가 존재하지 않습니다.
            서버가 발급하지 않은 형식의 classId도 같은 응답입니다.
            Class가 존재하지만 현재 사용자가 접근할 수 없으면 이 응답이 아니라 403입니다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /classes/{classId}/memberships:
    get:
      tags: [Classes]
      summary: Class 참여자 목록 조회
      operationId: listClassMemberships
      description: |
        강사가 실습 대상 학생을 확인하거나 Class 참여 상태를 조회할 때 사용합니다.
        서버는 Organization 소속과 대상 Class의 ClassMembership 관계를 기준으로
        조회 권한을 검증합니다.
      parameters:
        - $ref: '#/components/parameters/ClassId'
      responses:
        '200':
          description: 현재 사용자가 조회할 수 있는 ClassMembership 목록입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassMembershipList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-specs:
    get:
      tags: [LabSpecs]
      summary: 조회 가능한 LabSpec 목록 조회
      operationId: listLabSpecs
      responses:
        '200':
          description: 현재 사용자가 조회할 수 있는 LabSpec 목록입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSpecList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [LabSpecs]
      summary: LabSpec 생성
      operationId: createLabSpec
      description: |
        실습 정의만 저장합니다.
        이 요청 자체로 OpenStack VM, Network 등 Provider 리소스를 생성하지 않습니다.
      requestBody:
        required: true
        description: 저장할 LabSpec 정의
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabSpecWrite'
      responses:
        '201':
          description: LabSpec을 생성했습니다. OpenStack 리소스는 생성하지 않았습니다.
          headers:
            Location:
              description: 생성된 LabSpec의 상대 URL입니다.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSpec'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /lab-specs/{labSpecId}:
    get:
      tags: [LabSpecs]
      summary: LabSpec 상세 조회
      operationId: getLabSpec
      parameters:
        - $ref: '#/components/parameters/LabSpecId'
      responses:
        '200':
          description: LabSpec 상세입니다.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSpec'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [LabSpecs]
      summary: 자신이 소유한 LabSpec 수정
      operationId: updateLabSpec
      description: |
        LabSpec 수정 내용은 이후 새로 시작하는 LabExecution부터 적용합니다.
        이미 시작된 LabExecution과 Reset은 수정된 최신 LabSpec을 다시 해석하지 않고,
        생성 당시 저장한 immutable resolved CreationSnapshot을 계속 사용합니다.

        동시 수정으로 인한 덮어쓰기를 방지하기 위해 최신 조회/수정에서 받은
        ETag를 If-Match로 전달해야 합니다.
      parameters:
        - $ref: '#/components/parameters/LabSpecId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        description: LabSpec의 새 편집 가능 정의
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabSpecWrite'
      responses:
        '200':
          description: LabSpec을 수정했습니다.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabSpec'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /classes/{classId}/lab-executions:
    post:
      tags: [LabExecutions]
      summary: 선택한 학생을 대상으로 새 LabExecution 시작
      operationId: createLabExecution
      description: |
        강사가 대상 Class의 STUDENT Membership 사용자 중 이번 실습에 참여할 학생을
        직접 선택하고 새 LabExecution을 시작합니다.

        요청이 정상 접수되는 시점에 대상 학생 집합을 고정합니다.
        이후 Class에 학생이 추가되거나 Membership이 변경되어도 현재 LabExecution의
        대상 학생 집합은 자동으로 바뀌지 않습니다.

        선택한 학생에게만 학생용 LabInstance를 생성하며,
        해당 LabExecution을 시작한 강사용 LabInstance 1개는 별도로 생성합니다.

        Provider 작업은 오래 걸릴 수 있으므로 HTTP 요청에서 완료까지 기다리지 않습니다.
        서버는 제품 상태와 Operation을 먼저 영속한 뒤 202 Accepted를 반환하고,
        이후 작업 상태는 Operation 리소스로 조회합니다.

        내부 작업 전달 방식은 PostgreSQL polling에서 SQS 등으로 변경될 수 있지만
        이 HTTP 계약에는 해당 구현 방식을 노출하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/ClassId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: 사용할 LabSpec과 이번 실행에 참여할 학생 목록
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabExecutionRequest'
      responses:
        '200':
          description: |
            동일한 의미의 요청을 같은 Idempotency-Key로 다시 보낸 경우
            이미 존재하는 Operation과 대상 리소스를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '202':
          description: Provision 요청을 접수했으며 비동기 실행을 시작합니다.
          headers:
            Location:
              $ref: '#/components/headers/OperationLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /lab-executions/{labExecutionId}:
    get:
      tags: [LabExecutions]
      summary: LabExecution 상세 조회
      operationId: getLabExecution
      parameters:
        - $ref: '#/components/parameters/LabExecutionId'
      responses:
        '200':
          description: LabExecution의 상태, 고정된 대상 학생 집합과 LabInstance 목록입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabExecution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-executions/{labExecutionId}/cleanup:
    post:
      tags: [LabExecutions]
      summary: LabExecution 리소스 Cleanup
      operationId: cleanupLabExecution
      description: |
        대상 LabExecution에 연결된 Terminal/Live 상태와 Provider 리소스를 정리합니다.
        Class, LabSpec, 과거 LabExecution 기록 자체는 삭제하지 않습니다.

        일부 Provider 리소스 삭제에 실패하면 완료로 표시하지 않고,
        잔여 리소스를 추적하여 Cleanup을 다시 시도할 수 있어야 합니다.
      parameters:
        - $ref: '#/components/parameters/LabExecutionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 같은 Idempotency-Key의 재요청으로 기존 Operation과 결과를 반환했습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '202':
          description: Cleanup 요청을 접수했으며 비동기 실행을 시작합니다.
          headers:
            Location:
              $ref: '#/components/headers/OperationLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /lab-instances/{labInstanceId}:
    get:
      tags: [LabInstances]
      summary: LabInstance 상세 조회
      operationId: getLabInstance
      parameters:
        - $ref: '#/components/parameters/LabInstanceId'
      responses:
        '200':
          description: 사용자별 LabInstance의 현재 상태와 generation 정보입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /lab-instances/{labInstanceId}/reset:
    post:
      tags: [LabInstances]
      summary: 생성 당시 기준으로 LabInstance Reset
      operationId: resetLabInstance
      description: |
        LabInstance의 ID는 유지하고 Provider 리소스 generation을 증가시키며
        생성 당시 저장한 immutable resolved CreationSnapshot 기준으로 환경을 재생성합니다.

        파괴적인 기존 리소스 삭제 전에 D-19의 재현 가능성 Preflight를 수행합니다.
        원본 Image/Flavor 등 재현 조건을 만족하지 못하면 기존 환경을 먼저 삭제하지 않고
        Reset 요청을 실패시킵니다.
      parameters:
        - $ref: '#/components/parameters/LabInstanceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 같은 Idempotency-Key의 재요청으로 기존 Operation과 결과를 반환했습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '202':
          description: Reset 요청을 접수했으며 비동기 실행을 시작합니다.
          headers:
            Location:
              $ref: '#/components/headers/OperationLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /lab-instances/{labInstanceId}/terminal-targets:
    get:
      tags: [TerminalSessions]
      summary: 본인 LabInstance에서 Terminal을 열 수 있는 VM 목록 조회
      operationId: listTerminalTargets
      description: |
        현재 사용자가 소유한 LabInstance에서 TerminalSession을 열 수 있는 VM의 목록입니다.
        `POST /lab-instances/{labInstanceId}/terminal-sessions`의 `targetVmKey`는 이 응답의 `items[].vmKey`를
        그대로 사용합니다. 클라이언트가 `"workspace"` 같은 key를 하드코딩하거나 `role`/`instanceIndex`로 만들어서는 안 됩니다.

        Terminal은 Editor/Preview처럼 Workspace VM 하나에 한정되지 않고 LabInstance 안의 여러 VM 중에서 선택할 수 있으므로
        `items`는 Workspace VM을 포함한 모든 target입니다. `workspaceVmKey`는 `items` 중 Workspace VM을 가리키는
        기본 선택 hint입니다.

        목록의 원본은 해당 LabExecution에 고정된 immutable resolved CreationSnapshot입니다. 최신 LabSpec을 다시 해석하지 않으며
        Provider 내부 topology(Provider Server ID, Connector ID, private IP, 이미지·flavor 등)는 응답에 포함하지 않습니다.
        이 목록은 논리적으로 선택할 수 있는 VM이며 VM이 지금 사용 가능하다는 보증이 아닙니다. 실제 TerminalSession 생성 가능 여부는
        생성 시점의 LabInstance status, 현재 generation, ProviderResource로 다시 판단합니다.

        TerminalSession 생성과 같은 권한 경계를 사용합니다. 하나라도 맞지 않으면 거절합니다.

        - LabInstance가 현재 사용자의 것이며 같은 Organization에 속합니다(`403`). 강사나 Organization `ADMIN`도
          다른 사용자의 LabInstance는 조회할 수 없습니다.
        - 사용자가 LabInstance가 속한 Class의 현재 ClassMembership(INSTRUCTOR 또는 STUDENT)을 가집니다(`403`).
        - LabInstance status가 `READY`입니다(`409`, code `lab_instance_not_ready`).

        저장된 CreationSnapshot을 해석할 수 없거나 서로 모순되면(빈 key, 중복 `vmKey`, `workspaceVmKey`가 `items`에 없음 등)
        일부만 반환하지 않고 `500`으로 거절합니다. 응답은 `Cache-Control: no-store`입니다.
      parameters:
        - $ref: '#/components/parameters/LabInstanceId'
      responses:
        '200':
          description: Terminal을 열 수 있는 VM 목록입니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalTargetList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /lab-instances/{labInstanceId}/terminal-sessions:
    post:
      tags: [TerminalSessions]
      summary: 본인 LabInstance의 VM에 TerminalSession 생성
      operationId: createTerminalSession
      description: |
        현재 사용자가 소유한 LabInstance의 현재 generation에 있는 VM 하나에 새 TerminalSession을 만들고,
        Browser Terminal WSS(`/realtime/v1/terminal`)에 attach할 때 사용하는 terminal-scoped opaque
        `sessionToken`을 발급합니다.

        서버는 요청의 `targetVmKey`만 받아 현재 DB 상태에서 대상 VM과 Connector를 결정합니다.
        `targetVmKey`는 `GET /lab-instances/{labInstanceId}/terminal-targets`가 돌려준 `vmKey`여야 하며,
        서버는 조회 결과를 신뢰하지 않고 생성 시점에 다시 판단합니다.
        Provider Server ID, Connector ID, generation은 요청으로 받지 않으며 신뢰하지 않습니다.
        다음을 모두 만족해야 TerminalSession을 만들 수 있고, 하나라도 맞지 않으면 어떤 side effect도 만들기 전에 거절합니다.

        - LabInstance가 현재 사용자의 것이며 같은 Organization에 속합니다(`403`).
        - 사용자가 LabInstance가 속한 Class의 현재 ClassMembership(INSTRUCTOR 또는 STUDENT)을 가집니다(`403`).
        - LabInstance status가 `READY`입니다(`409`, code `lab_instance_not_ready`).
        - `targetVmKey`가 해당 LabExecution의 immutable CreationSnapshot에 있는 VM입니다(`422`, code `invalid_terminal_target`).
          현재 generation에 같은 이름의 ProviderResource가 있어도 CreationSnapshot에 없는 key는 target이 아닙니다.
        - 그 VM에 해당하는 현재 generation의 SERVER ProviderResource가 `PRESENT`입니다.
          리소스가 없거나 `PRESENT`가 아니면 `409`, code `terminal_target_unavailable`입니다.

        강사가 학생 LabInstance의 Terminal을 직접 여는 기능은 이 계약 범위가 아닙니다.

        TerminalSession 생성은 동기적으로 완료됩니다. 서버가 Connector에 PTY 준비를 요청하고, Connector의 Terminal Data
        채널이 실제로 연결된 것을 확인한 뒤에만 `201`을 반환합니다. Connector를 사용할 수 없거나 준비에 실패하거나
        시간 안에 끝나지 않으면 TerminalSession은 성공 상태로 남지 않고 `503`으로 실패합니다
        (code `connector_unavailable` 또는 `terminal_open_failed`).

        이 배포 구성이 Terminal Relay를 제공하지 않으면 `503`(code `terminal_unavailable`)입니다.

        응답에는 Browser가 연결하는 데 필요한 최소 정보만 포함합니다. WSS endpoint와 subprotocol은 고정이며
        세션마다 URL을 돌려주지 않습니다. 응답은 `Cache-Control: no-store`입니다.
      parameters:
        - $ref: '#/components/parameters/LabInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTerminalSessionRequest'
      responses:
        '201':
          description: TerminalSession이 만들어졌고 Browser가 attach할 수 있습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /terminal-sessions/{terminalSessionId}:
    delete:
      tags: [TerminalSessions]
      summary: TerminalSession 명시적 종료
      operationId: closeTerminalSession
      description: |
        사용자가 자신의 TerminalSession을 명시적으로 종료합니다. Browser WSS의 일시적 단절과 달리
        60초 reconnect grace를 시작하지 않고 즉시 `ENDED`로 전환하며, 이 TerminalSession의 attach token은
        더 이상 사용할 수 없습니다. 열려 있는 Browser WSS에는 `TERMINAL_SESSION_ENDED`(reason `SESSION_CLOSED`)를 전달합니다.

        이미 종료된 TerminalSession에 대한 반복 요청도 `204`입니다(멱등).

        서버는 Connector에 PTY 종료(`TERMINAL_CLOSE`)를 요청합니다. Connector를 사용할 수 없어 전달하지 못해도
        Labbit의 TerminalSession은 `ENDED`이며 이후 attach할 수 없습니다. 남은 PTY 정리는 Connector lifecycle의 책임입니다.
      parameters:
        - $ref: '#/components/parameters/TerminalSessionId'
      responses:
        '204':
          description: TerminalSession이 종료되었습니다(이미 종료된 경우 포함).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /lab-instances/{labInstanceId}/files/tree:
    get:
      tags: [WorkspaceFiles]
      summary: 본인 Workspace의 디렉터리 하나 나열
      operationId: listWorkspaceFiles
      description: |
        현재 사용자가 소유한 LabInstance의 Workspace VM에서 디렉터리 하나의 직계 항목을 나열합니다.
        재귀 조회는 제공하지 않으며 클라이언트가 디렉터리를 펼칠 때마다 그 디렉터리의 `path`로 다시 조회합니다.

        Browser는 VM, Connector, Provider Server, generation, private address를 선택하거나 알 필요가 없습니다. 서버가 LabExecution의
        immutable CreationSnapshot의 `workspaceVmKey`와 현재 generation의 `PRESENT` `SERVER` ProviderResource로 대상 VM을
        결정하고 Connector와 Workspace VM의 SFTP를 거쳐 조회합니다. Browser가 VM private network나 SFTP에 직접 접근하지 않습니다.

        권한 경계는 TerminalSession 생성과 같습니다. 하나라도 맞지 않으면 Connector를 호출하기 전에 거절합니다.

        - LabInstance가 현재 사용자의 것이며 같은 Organization에 속합니다(`403`). 강사나 Organization `ADMIN`도
          다른 사용자의 LabInstance는 조회할 수 없습니다.
        - 사용자가 LabInstance가 속한 Class의 현재 ClassMembership(INSTRUCTOR 또는 STUDENT)을 가집니다(`403`).
        - LabInstance status가 `READY`입니다(`409`, code `lab_instance_not_ready`).
        - 현재 generation에 Workspace VM의 `PRESENT` `SERVER` ProviderResource가 정확히 하나 있습니다. 없으면 `409`,
          code `workspace_target_unavailable`입니다. 저장된 CreationSnapshot이나 ProviderResource 관계가 모순이면 `500`입니다.

        `path`는 `path` query parameter에 정의한 경로 규칙을 따릅니다. 생략하거나 빈 값이면 Workspace root입니다.
        `items`는 `name`의 UTF-8 byte 순서 오름차순입니다. 항목의 `kind`는 `file`과 `directory`뿐이며 그 밖의 종류의
        항목(예: symlink, device)이나 위 경로 규칙으로 표현할 수 없는 이름은 목록에 포함하지 않습니다. uid/gid, POSIX mode,
        크기, 수정 시각 같은 파일 metadata는 노출하지 않습니다.

        지정한 경로가 없으면 `404`(code `path_not_found`), 디렉터리가 아니면 `422`(code `path_not_directory`)입니다.
        목록이 Connector 전송 한도를 넘으면 `413`(code `directory_too_large`)입니다. Connector나 VM을 사용할 수 없으면
        `503`입니다(code `connector_unavailable` 또는 `file_transport_unavailable`).

        응답에는 파일 본문이 없지만 Workspace 구조는 학생 작업물이므로 `Cache-Control: no-store`입니다.
      parameters:
        - $ref: '#/components/parameters/LabInstanceId'
        - $ref: '#/components/parameters/WorkspaceDirectoryPath'
      responses:
        '200':
          description: 요청한 디렉터리의 직계 항목입니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileTree'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /lab-instances/{labInstanceId}/files/content:
    get:
      tags: [WorkspaceFiles]
      summary: 본인 Workspace의 UTF-8 text 파일 읽기
      operationId: readWorkspaceFile
      description: |
        현재 사용자가 소유한 LabInstance의 Workspace VM에서 UTF-8 text 파일 하나를 읽습니다.
        대상 VM 결정과 권한 경계는 `GET /lab-instances/{labInstanceId}/files/tree`와 같습니다.

        응답의 `ETag`는 이 읽기 시점의 파일 revision을 나타내는 opaque 값이며 `PUT`의 `If-Match`로 되돌려 보냅니다.
        revision을 만드는 방식과 형식은 호환성 계약이 아니므로 클라이언트는 해석하지 않습니다.

        MVP는 UTF-8 text editor만 지원합니다. 파일 본문이 유효한 UTF-8이 아니면 `422`(code `unsupported_encoding`),
        NUL byte를 포함한 binary이면 `422`(code `binary_content`)이며 본문을 응답에 싣지 않습니다. 파일이 설정된 크기
        한도를 넘으면 `413`(code `file_too_large`)입니다. 한도의 수치는 계약이 아니며 배포 구성에 따라 달라질 수 있습니다.
        지정한 경로가 없으면 `404`(code `path_not_found`), 일반 파일이 아니면 `422`(code `path_not_file`)입니다.
        Workspace VM 파일 시스템이 접근을 거절하면 `403`(code `file_permission_denied`)이며 이는 Labbit 권한과 구분되는 VM 내부 권한입니다.

        파일 본문과 경로는 PostgreSQL과 log, trace, metric에 저장하거나 기록하지 않습니다. 응답은 `Cache-Control: no-store`입니다.
      parameters:
        - $ref: '#/components/parameters/LabInstanceId'
        - $ref: '#/components/parameters/WorkspaceFilePath'
      responses:
        '200':
          description: 파일 본문과 revision입니다.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    put:
      tags: [WorkspaceFiles]
      summary: 본인 Workspace의 기존 UTF-8 text 파일 저장
      operationId: saveWorkspaceFile
      description: |
        기존 파일 하나의 본문을 교체합니다. 새 파일 생성, 이름 변경, 삭제는 이 계약 범위가 아닙니다. 지정한 경로에 파일이 없으면
        `404`(code `path_not_found`)이며 파일을 만들지 않습니다.

        `If-Match`에 같은 파일을 읽을 때 받은 `ETag` 하나를 반드시 보내야 합니다. 서버는 저장 직전에 현재 파일 revision과
        비교해 일치할 때만 저장하고, 다르면 덮어쓰지 않고 `412`(code `stale_revision`)로 거절합니다. 클라이언트는 다시 읽어
        변경 내용을 합친 뒤 저장합니다. `If-Match`가 없으면 `400`(code `if_match_required`), 하나의 strong entity-tag가
        아니면(`*`, 목록, weak validator 포함) `400`(code `invalid_if_match`)입니다.

        대상 VM 결정과 권한 경계는 `GET /lab-instances/{labInstanceId}/files/tree`와 같고, unsafe method이므로 Origin 검증도 적용합니다.

        요청 본문은 `{"content": "..."}`입니다. 유효한 UTF-8이 아니거나 짝이 맞지 않는 surrogate escape가 있으면
        `422`(code `unsupported_encoding`), NUL을 포함하면 `422`(code `binary_content`), 설정된 크기 한도를 넘으면
        `413`(code `file_too_large`)이며 Connector를 호출하기 전에 거절합니다.

        성공하면 새 revision을 `ETag`로 돌려줍니다. Connector 응답을 받지 못해 저장 여부를 알 수 없으면(전송 이후 연결 단절,
        시간 초과) 서버는 자동으로 다시 저장하지 않고 `503`(code `file_save_outcome_unknown`)으로 알립니다. 클라이언트는
        파일을 다시 읽어 저장 여부를 확인합니다. 저장 중 Workspace VM의 generation이 바뀌었거나 LabInstance가 더 이상 `READY`가
        아니면 성공으로 처리하지 않고 `409`(code `workspace_target_changed`)입니다.

        파일 본문과 경로는 PostgreSQL과 log, trace, metric에 저장하거나 기록하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/LabInstanceId'
        - $ref: '#/components/parameters/WorkspaceFilePath'
        - $ref: '#/components/parameters/WorkspaceFileIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWorkspaceFileRequest'
      responses:
        '200':
          description: 파일을 저장했습니다. `ETag`는 저장된 파일의 새 revision입니다.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileSaved'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /lab-instances/{labInstanceId}/preview-sessions:
    post:
      tags: [PreviewSessions]
      summary: 본인 Workspace VM application port에 PreviewSession 생성
      operationId: createPreviewSession
      description: |
        현재 사용자가 소유한 LabInstance의 Workspace VM에서 실행 중인 application의 TCP port 하나에 대한 PreviewSession을 만들고,
        사용자 코드가 실행되는 **SaaS 본 서비스 Origin과 분리된 Preview Origin**의 `previewUrl`을 발급합니다.

        요청에는 `targetPort`만 있습니다. Browser는 VM, Connector, Provider Server, generation, private address를 선택하거나 알 필요가 없으며
        서버가 LabExecution의 immutable CreationSnapshot의 `workspaceVmKey`와 현재 generation의 `PRESENT` `SERVER` ProviderResource로 대상 VM을
        결정합니다. 응답과 `previewUrl`에는 VM IP/port, Provider Server ID, Connector ID가 없습니다.

        다음을 모두 만족해야 PreviewSession을 만들 수 있고, 하나라도 맞지 않으면 어떤 side effect도 만들기 전에 거절합니다
        (Connector에 어떤 Control/Data message도 보내지 않습니다).

        - LabInstance가 현재 사용자의 것이며 같은 Organization에 속합니다(`403`). 강사나 Organization `ADMIN`도
          다른 사용자의 LabInstance를 Preview할 수 없습니다.
        - 사용자가 LabInstance가 속한 Class의 현재 ClassMembership(INSTRUCTOR 또는 STUDENT)을 가집니다(`403`).
        - LabInstance status가 `READY`입니다(`409`, code `lab_instance_not_ready`).
        - 현재 generation에 Workspace VM의 `PRESENT` `SERVER` ProviderResource가 정확히 하나 있습니다. 없으면 `409`,
          code `workspace_target_unavailable`입니다. 저장된 CreationSnapshot이나 ProviderResource 관계가 모순이면 `500`입니다.
        - `targetPort`가 Backend가 **명시적으로 설정한 허용 목록**(Runtime Contract `LABBIT_PREVIEW_ALLOWED_PORTS`)에 있습니다.
          숫자 범위만으로 자동 승인하지 않으며 SSH 관리 port(`22`)는 허용 목록에 있어도 거절합니다(`403`, code `preview_port_not_allowed`).
          허용 목록의 값 자체는 이 계약이 정하지 않으며 응답에도 노출하지 않습니다. 승인은 이 PreviewSession의 정확한 port 하나에 bind되며
          Connector에는 승인한 port만 전달합니다.

        PreviewSession 생성은 동기적으로 완료됩니다. 서버가 Connector에 TCP forwarding 준비를 요청하고 Connector의 Preview Data 채널이
        실제로 연결된 것을 확인한 뒤에만 `201`을 반환합니다. 생성 도중 LabInstance의 generation이 바뀌었거나 `READY`를 벗어나면
        성공으로 처리하지 않고 `409`(code `workspace_target_changed`)로 실패합니다. 생성에 실패하면 PreviewSession은 남지 않습니다.

        생성 실패의 의미는 다음과 같습니다. 응답에 Connector나 SSH/provider 오류 원문은 포함하지 않습니다.

        - `502` `preview_app_not_running`: Workspace VM에는 도달했지만 그 port에서 listen하는 application이 없습니다.
        - `403` `preview_port_rejected`: Connector가 그 port의 forwarding을 거절했습니다.
        - `504` `preview_target_unreachable`: Workspace VM 또는 SSH Connection에 도달할 수 없습니다.
        - `504` `preview_open_timeout`: Connector가 시간 안에 준비를 끝내지 못했습니다.
        - `503` `connector_unavailable`: Connector Control connection이 없습니다.
        - `503` `preview_transport_unavailable`: 연결된 Connector가 Preview transport를 지원하지 않습니다.
        - `503` `preview_open_failed`: 그 밖에 Connector가 PreviewSession을 열지 못했습니다.
        - `503` `preview_unavailable`: 이 배포 구성이 Preview Gateway를 제공하지 않습니다.

        `previewUrl`은 Preview Origin의 bootstrap 경로이며 **fragment에 일회용 bootstrap credential**을 포함합니다. credential은 이 응답에서만
        원문으로 나가며 서버에는 digest만 남습니다. fragment는 HTTP request target, `Referer`, 서버·proxy access log에 전송되지 않습니다.
        클라이언트는 `previewUrl`을 그대로 열기만 하며(새 탭 또는 iframe) credential을 URL query/path로 옮기거나 log·저장하지 않습니다.
        Preview Origin이 credential을 교환해 Preview 전용 Cookie를 발급하는 절차는 `/__labbit/bootstrap`과 `/__labbit/exchange`를 따릅니다.
        응답은 `Cache-Control: no-store`입니다.

        PreviewSession은 서버 구성의 TTL 뒤 만료됩니다(`expiresAt`). 만료, 명시적 종료, Workspace tunnel 종료 뒤에는 Preview Origin의 모든 요청이
        `401`입니다. PreviewSession은 process 안의 ephemeral 상태이며 서버 재시작 뒤 복구하지 않습니다.
      parameters:
        - $ref: '#/components/parameters/LabInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreviewSessionRequest'
      responses:
        '201':
          description: PreviewSession이 만들어졌고 `previewUrl`을 열 수 있습니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /preview-sessions/{previewSessionId}:
    delete:
      tags: [PreviewSessions]
      summary: PreviewSession 명시적 종료
      operationId: closePreviewSession
      description: |
        사용자가 자신의 PreviewSession을 명시적으로 종료합니다. 즉시 Preview Origin의 Cookie 인증이 무효가 되고(이후 요청은 `401`)
        열려 있는 Workspace tunnel이 닫힙니다.

        이미 종료되었거나 만료된 PreviewSession에 대한 반복 요청도 `204`입니다(멱등). 서버가 기억하지 못하는 ID(알 수 없는 ID,
        서버 재시작 뒤)는 `404`, 다른 사용자의 PreviewSession은 `403`입니다.

        서버는 Connector에 TCP forwarding 종료(`PREVIEW_CLOSE`)를 요청합니다. Connector를 사용할 수 없어 전달하지 못해도
        Labbit의 PreviewSession은 종료된 상태이며 이후 사용할 수 없습니다.
      parameters:
        - $ref: '#/components/parameters/PreviewSessionId'
      responses:
        '204':
          description: PreviewSession이 종료되었습니다(이미 종료된 경우 포함).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /__labbit/bootstrap:
    servers:
      - url: 'https://{previewSessionId}.preview.example.invalid'
        description: |
          Preview Origin입니다. 실제 host는 서버 구성(`LABBIT_PREVIEW_ORIGIN_TEMPLATE`)이 정하며 `createPreviewSession`이 돌려준 `previewUrl`의
          origin입니다. SaaS 본 서비스 Origin과 다르고 PreviewSession마다 다른 host입니다. `.invalid` host는 예시일 뿐입니다.
        variables:
          previewSessionId:
            default: 00000000-0000-0000-0000-000000000000
            description: PreviewSession의 ID가 host의 첫 label입니다.
    get:
      tags: [PreviewSessions]
      summary: Preview Origin의 bootstrap 페이지
      operationId: getPreviewBootstrap
      security: []
      description: |
        `previewUrl`이 가리키는 페이지입니다. 모든 PreviewSession에 같은 정적 HTML이며 credential이나 사용자 정보를 담지 않습니다.
        Browser JavaScript가 `location.hash`의 일회용 bootstrap credential을 읽어 fragment를 주소에서 지운 뒤
        `POST /__labbit/exchange`로 교환하고, 성공하면 Workspace application의 `/`로 이동합니다.

        Preview Origin은 이 두 경로(`/__labbit/` prefix)를 제외한 모든 요청을 Preview 전용 Cookie로 인증한 뒤 PreviewSession의
        Workspace application으로 proxy합니다. `/__labbit/` prefix는 예약되어 Workspace application으로 전달하지 않습니다.

        PreviewSession이 없거나 종료·만료되었으면 `401`입니다. 응답은 `Cache-Control: no-store`, `Referrer-Policy: no-referrer`이며
        inline script를 제한하는 `Content-Security-Policy`를 포함합니다.
      responses:
        '200':
          description: bootstrap 페이지입니다.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/PreviewUnauthorized'
        '503':
          $ref: '#/components/responses/PreviewUnavailable'

  /__labbit/exchange:
    servers:
      - url: 'https://{previewSessionId}.preview.example.invalid'
        description: Preview Origin입니다(`/__labbit/bootstrap`의 설명과 같음).
        variables:
          previewSessionId:
            default: 00000000-0000-0000-0000-000000000000
    post:
      tags: [PreviewSessions]
      summary: bootstrap credential을 Preview 전용 Cookie로 교환
      operationId: exchangePreviewCredential
      security: []
      description: |
        `previewUrl`의 fragment에 있던 일회용 bootstrap credential을 Preview Origin의 Preview 전용 Cookie로 교환합니다.
        `Origin` header가 이 Preview Origin과 정확히 같아야 하며(다르면 `403` code `csrf_rejected`) 같은 Origin의 JavaScript만 호출할 수 있습니다.

        credential은 암호학적으로 안전한 난수이고 **단 한 번만** 성공하며 짧은 시간(서버 구성, PreviewSession TTL보다 길지 않음) 안에
        교환해야 합니다. 알 수 없거나 이미 사용했거나 만료된 credential, 종료·만료된 PreviewSession은 모두 같은 `401`입니다. 서버에는
        credential의 digest만 있고 성공하면 즉시 무효가 됩니다. credential은 URL query/path에 넣지 않으며 request body로만 전달합니다.

        성공하면 `204`이고 `previewCookie`를 발급합니다. 이 Cookie는 Preview Origin 전용이고 Workspace application으로 전달되지 않으며
        PreviewSession이 만료·종료되면 서버에서 즉시 무효가 됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewExchangeRequest'
      responses:
        '204':
          description: credential을 교환했고 Preview 전용 Cookie를 발급했습니다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/PreviewSetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/PreviewUnauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '503':
          $ref: '#/components/responses/PreviewUnavailable'

  /operations/{operationId}:
    get:
      tags: [Operations]
      summary: 비동기 Operation 상태 조회
      operationId: getOperation
      description: |
        Operation은 오래 걸리는 Provider 작업을 HTTP에서 안정적으로 추적하기 위한
        제품 수준의 비동기 작업 리소스입니다.

        클라이언트는 SQS, Kafka, PostgreSQL polling 같은 내부 Queue/Broker 기술을
        알 필요가 없으며, Operation의 status와 stage를 통해 진행 상태를 확인합니다.
      parameters:
        - $ref: '#/components/parameters/OperationId'
      responses:
        '200':
          description: Operation의 현재 상태, 진행 단계, 대상 리소스와 안전한 오류 정보입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-labbit-session
      description: |
        Labbit Backend가 발급하는 opaque 브라우저 세션 식별자입니다.

        Production 및 production-like HTTPS 환경의 Cookie 속성은
        Secure, HttpOnly, SameSite=Lax, Path=/를 사용하고 Domain은 지정하지 않습니다.
        v0.1에서는 Max-Age/Expires를 두지 않는 non-persistent browser Cookie로 사용합니다.
        브라우저는 Cookie 값을 직접 읽거나 인증 상태의 원본으로 사용하지 않습니다.

        로그인 성공마다 cryptographically-random 새 Session token을 발급하며
        기존 Cookie 값을 인증 후 세션 ID로 재사용하거나 고정하지 않습니다.
        서버 Session의 v0.1 absolute lifetime은 생성 시점부터 8시간이며
        활동에 따른 sliding extension이나 주기적 token renewal은 적용하지 않습니다.
        만료·폐기·비활성 사용자 또는 Password 변경 이전 Session은 인증에 사용할 수 없고
        보호 API는 401을 반환합니다.

        세션 저장소는 HTTP 계약의 구현 상세입니다.
        PostgreSQL에서 다른 저장소로 변경하더라도 Cookie와 인증 의미는 유지합니다.

        POST/PUT/PATCH/DELETE 같은 unsafe method는 SameSite Cookie만 신뢰하지 않고,
        서버가 trusted public origin과 Origin을 정확히 비교합니다.
        Origin이 없는 경우 Referer의 origin을 fallback으로 확인하며
        둘 다 없거나 일치하지 않으면 403으로 거절합니다.
        구체 구현 기준은 docs/backend/auth-session.md를 따릅니다.
    previewCookie:
      type: apiKey
      in: cookie
      name: __Host-labbit-preview
      description: |
        **Preview Origin(SaaS 본 서비스 Origin과 다른 host)에서만** 쓰는 Preview 전용 Cookie입니다. 로그인 Session Cookie와 별개이며
        SaaS 본 서비스 Origin의 인증에 쓰이지 않습니다. 이 API의 `/api/v1` 경로에는 적용되지 않습니다.

        `POST /__labbit/exchange`가 일회용 bootstrap credential을 교환할 때 발급하며 값은 CSPRNG가 만든 32 bytes의 padding 없는
        Base64URL 문자열입니다. 서버는 원문을 저장하지 않고 SHA-256 digest만 보관하고 constant time으로 비교합니다.

        속성은 HttpOnly, Path=/, SameSite=Lax이며 **Domain을 지정하지 않는** host-only Cookie입니다. HTTPS Preview Origin(production 필수)에서는
        Secure이고 이름이 `__Host-labbit-preview`입니다. 개발용 HTTP Preview Origin에서만 `__Host-` prefix를 쓸 수 없으므로
        `labbit-preview`이고 Secure가 아닙니다. 만료 시각은 PreviewSession의 `expiresAt`이며 서버가 PreviewSession의 만료·종료를 즉시 반영합니다.
        Cookie 값만으로 인증하지 않고 매 요청마다 PreviewSession의 상태(활성, 만료 전)와 digest를 확인합니다.

        Preview Origin의 Gateway는 이 Cookie와 로그인 Session Cookie를 Workspace application으로 전달하지 않습니다(Workspace application이 설정한
        그 밖의 Cookie는 전달합니다). 사용자 코드가 설정하는 Cookie의 `Domain` attribute는 제거해 PreviewSession마다 host-only로 유지합니다.
        Preview Origin을 SaaS 본 서비스 Origin과 same-site로 두거나 새 탭으로 열 때 Cookie가 전송됩니다. cross-site iframe 삽입에는
        `SameSite=None; Partitioned`가 필요하며 이 계약은 지원하지 않습니다.

  parameters:
    ClassId:
      name: classId
      in: path
      required: true
      description: 조회하거나 조작할 Class의 opaque ID입니다.
      schema:
        $ref: '#/components/schemas/ResourceId'

    LabSpecId:
      name: labSpecId
      in: path
      required: true
      description: 조회하거나 수정할 LabSpec의 opaque ID입니다.
      schema:
        $ref: '#/components/schemas/ResourceId'

    LabExecutionId:
      name: labExecutionId
      in: path
      required: true
      description: 조회하거나 Cleanup할 LabExecution의 opaque ID입니다.
      schema:
        $ref: '#/components/schemas/ResourceId'

    LabInstanceId:
      name: labInstanceId
      in: path
      required: true
      description: 조회하거나 Reset할 LabInstance의 opaque ID입니다.
      schema:
        $ref: '#/components/schemas/ResourceId'

    OperationId:
      name: operationId
      in: path
      required: true
      description: 조회할 비동기 Operation의 opaque ID입니다.
      schema:
        $ref: '#/components/schemas/ResourceId'

    TerminalSessionId:
      name: terminalSessionId
      in: path
      required: true
      description: 종료할 TerminalSession의 opaque ID입니다.
      schema:
        $ref: '#/components/schemas/ResourceId'

    PreviewSessionId:
      name: previewSessionId
      in: path
      required: true
      description: 종료할 PreviewSession의 opaque ID입니다.
      schema:
        $ref: '#/components/schemas/ResourceId'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        하나의 의미적 변경 요청을 식별하기 위해 클라이언트가 생성하는 opaque key입니다.

        같은 사용자·Endpoint·대상·payload에 대해 같은 key를 다시 사용하면
        새로운 Provider 작업을 만들지 않고 기존 Operation 또는 결과를 반환합니다.

        같은 key를 서로 다른 대상이나 payload에 재사용하면 409 Conflict로 처리합니다.
      schema:
        type: string
        minLength: 1
        maxLength: 255

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        최신 LabSpec 조회 또는 수정 응답의 ETag입니다.
        현재 버전과 일치할 때만 수정을 허용하며 stale update를 방지합니다.
      schema:
        type: string

    WorkspaceDirectoryPath:
      name: path
      in: query
      required: false
      description: |
        Workspace root 기준의 상대 디렉터리 경로입니다. 생략하거나 빈 값이면 root입니다.
        경로 규칙은 `WorkspaceFilePath`와 같습니다.
      schema:
        type: string
        maxLength: 4096

    WorkspaceFilePath:
      name: path
      in: query
      required: true
      description: |
        Workspace root 기준의 상대 POSIX 경로입니다. 실제 VM의 절대 경로와 Workspace root 위치는 노출하지 않으며 이 계약도 정하지 않습니다.

        서버는 query의 percent-decoding을 한 번만 수행하고 그 결과를 다시 decode하거나 정규화하지 않습니다. 경로를 조용히 고쳐 쓰지
        않으므로 아래를 하나라도 위반하면 `400`(code `invalid_path`)이고 Connector를 호출하지 않습니다. 목록(`items[].path`)이
        돌려준 값은 항상 이 규칙을 만족하며 그대로 다시 보낼 수 있습니다.

        - `/`로 시작하거나 끝나지 않고, 빈 segment(`a//b`)가 없습니다. 비어 있을 수 있는 것은 Workspace root를 가리키는 Tree의 `path`뿐입니다.
        - `.` 또는 `..` segment가 없습니다(`a/./b`, `a/../b`, `..` 모두 거절).
        - 백슬래시(`\`), NUL과 그 밖의 제어 문자(U+0000–U+001F, U+007F)가 없고 유효한 UTF-8입니다.
        - decode 결과에 percent-escape 형태(`%`와 두 개의 16진수, 예: `%2e`, `%2F`, `%5c`)가 남아 있지 않습니다. query에서 `%252e`처럼
          이중 인코딩한 경로가 decode 후 `%2e`로 남는 경우와 구분할 수 없으므로 거절합니다. (`/`를 `%2F`로 한 번 인코딩해 보내는 것은
          정상이며 서버가 `/`로 decode합니다.)
        - 전체 4096 byte, segment 하나 255 byte를 넘지 않습니다.

        Unicode 파일 이름은 유효한 UTF-8이면 그대로 사용하며 서버가 정규화(NFC/NFD)하지 않습니다.
      schema:
        type: string
        minLength: 1
        maxLength: 4096

    WorkspaceFileIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        같은 파일을 읽을 때 받은 `ETag` 하나입니다(strong entity-tag, 예: `"abc"`). 저장 직전의 현재 revision과 일치할 때만
        저장합니다. 없으면 `400`(code `if_match_required`), strong entity-tag 하나가 아니면 `400`(code `invalid_if_match`),
        일치하지 않으면 `412`(code `stale_revision`)입니다.
      schema:
        type: string

  headers:
    SessionSetCookie:
      description: '새 opaque token으로 Secure; HttpOnly; SameSite=Lax; Path=/, Domain 미지정의 non-persistent __Host-labbit-session Cookie를 발급합니다.'
      schema:
        type: string

    SessionClearCookie:
      description: '현재 Session을 서버에서 폐기하고 동일 Cookie scope에 Max-Age=0을 적용해 __Host-labbit-session Cookie를 제거합니다.'
      schema:
        type: string

    PreviewSetCookie:
      description: '새 opaque token으로 HttpOnly; SameSite=Lax; Path=/, Domain 미지정의 Preview 전용 Cookie를 발급합니다(HTTPS Preview Origin에서는 Secure, 이름 `__Host-labbit-preview`).'
      schema:
        type: string

    ETag:
      description: 조건부 수정에 사용하는 opaque 엔터티 버전 값입니다.
      schema:
        type: string

    OperationLocation:
      description: 접수된 Operation을 조회할 수 있는 상대 URL입니다.
      schema:
        type: string

    NoStore:
      description: 응답(예를 들어 발급한 token)을 Browser나 중간 cache가 저장하지 않게 합니다. 값은 `no-store`입니다.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        요청 JSON의 문법이나 기본 형식이 올바르지 않습니다.

        Workspace file API에서는 code `invalid_request`(query/body 형식 오류, 필수 `path` 누락, `path` 중복), `invalid_path`(경로 규칙 위반),
        `if_match_required`, `invalid_if_match`입니다.

        PreviewSession 생성과 bootstrap 교환에서는 code `invalid_request`(body 형식 오류, `targetPort`가 1~65535의 정수가 아님 등)입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: 인증 정보가 없거나 유효하지 않거나 세션이 만료되었습니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: |
        인증은 되었지만 이 리소스나 동작에 필요한 권한이 없습니다.

        Workspace file API에서 Workspace VM 파일 시스템이 접근을 거절한 경우는 Labbit 권한 판정과 구분해 code `file_permission_denied`입니다.

        PreviewSession 생성에서 Labbit 권한 판정은 code `forbidden`, Backend 허용 목록에 없거나 SSH 관리 port인 `targetPort`는 code `preview_port_not_allowed`,
        Connector가 그 port의 forwarding을 거절한 경우는 code `preview_port_rejected`입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    CsrfRejected:
      description: |
        Browser unsafe-method 요청의 Origin/Referer가 trusted public origin과 일치하지 않아 요청을 거절했습니다.
        Preview Origin의 `POST /__labbit/exchange`에서는 `Origin`이 그 Preview Origin과 정확히 같지 않은 경우입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: |
        요청한 리소스가 존재하지 않거나 현재 사용자에게 보이지 않습니다.

        Workspace file API에서 LabInstance가 없으면 code `not_found`, Workspace의 파일이나 디렉터리가 없으면 code `path_not_found`입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: |
        현재 리소스 상태와 요청한 변경 작업이 충돌합니다.

        예:
        - Class에 이미 활성 LabExecution이 존재함
        - 같은 LabInstance에 다른 변경 Operation이 진행 중임
        - 같은 Idempotency-Key를 다른 의미의 요청에 재사용함
        - LabInstance가 아직 `READY`가 아니라 Terminal target 조회나 TerminalSession 생성을 할 수 없음(code `lab_instance_not_ready`)
        - 대상 VM이 현재 generation에서 사용할 수 없는 상태임(code `terminal_target_unavailable`)
        - LabInstance가 아직 `READY`가 아니라 Workspace file Tree/Read/Save를 할 수 없음(code `lab_instance_not_ready`)
        - 현재 generation에 Workspace VM의 `PRESENT` `SERVER` ProviderResource가 없어 file API를 사용할 수 없음(code `workspace_target_unavailable`)
        - file 요청을 처리하는 동안 Workspace VM의 generation이 바뀌었거나 LabInstance가 `READY`를 벗어나 결과를 성공으로 처리하지 않음(code `workspace_target_changed`)
        - LabInstance가 아직 `READY`가 아니라 PreviewSession을 만들 수 없음(code `lab_instance_not_ready`)
        - 현재 generation에 Workspace VM의 `PRESENT` `SERVER` ProviderResource가 없어 PreviewSession을 만들 수 없음(code `workspace_target_unavailable`)
        - PreviewSession을 만드는 동안 Workspace VM의 generation이 바뀌었거나 LabInstance가 `READY`를 벗어나 성공으로 처리하지 않음(code `workspace_target_changed`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    PreconditionFailed:
      description: |
        If-Match가 현재 리소스(LabSpec 또는 Workspace file)의 ETag와 일치하지 않아 수정을 적용하지 않았습니다.
        Workspace file은 code `stale_revision`이며 덮어쓰지 않았습니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    PayloadTooLarge:
      description: |
        Workspace file 또는 디렉터리 목록이 설정된 크기 한도를 넘습니다(code `file_too_large` 또는 `directory_too_large`).
        한도의 수치는 이 계약이 정하지 않으며 배포 구성에 따라 달라질 수 있습니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnprocessableEntity:
      description: |
        JSON 형식은 유효하지만 제품 규칙이나 의미 검증을 만족하지 않습니다.

        Workspace file API에서는 code `path_not_file`, `path_not_directory`, `unsupported_encoding`, `binary_content`입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ServiceUnavailable:
      description: |
        Connector 또는 Provider 같은 필수 의존성이 일시적으로 사용 불가능합니다.

        Workspace file API에서는 code `connector_unavailable`(Connector Control connection 없음), `file_transport_unavailable`
        (Connector가 File transport를 지원하지 않거나 시간 안에 응답하지 않거나 Workspace VM/SFTP를 사용할 수 없음),
        `file_save_outcome_unknown`(Save 요청을 보낸 뒤 결과를 받지 못해 저장 여부를 알 수 없음)입니다. 응답에 Connector나 SSH/SFTP
        오류 원문은 포함하지 않습니다.

        PreviewSession 생성/종료에서는 code `connector_unavailable`(Connector Control connection 없음), `preview_transport_unavailable`(Connector가
        Preview transport를 지원하지 않음), `preview_open_failed`(Connector가 PreviewSession을 열지 못함), `preview_unavailable`(이 배포 구성이
        Preview Gateway를 제공하지 않음)입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    BadGateway:
      description: |
        PreviewSession 생성에서 Workspace VM에는 도달했지만 요청한 port에서 listen하는 application이 없습니다(code `preview_app_not_running`).
        응답에 Connector나 SSH 오류 원문은 포함하지 않습니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    GatewayTimeout:
      description: |
        PreviewSession 생성에서 Workspace VM 또는 SSH Connection에 도달할 수 없습니다(code `preview_target_unreachable`).
        Connector가 시간 안에 PreviewSession을 열지 못한 경우는 code `preview_open_timeout`입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    PreviewUnauthorized:
      description: |
        Preview Origin에서 인증되지 않았습니다. credential/Cookie가 없거나 유효하지 않거나, 이미 사용한 bootstrap credential이거나,
        PreviewSession이 없거나 종료·만료되었습니다(code `preview_unauthenticated`). 이유를 구분하지 않으며 응답은 Workspace application의
        응답이 아닙니다. Preview Origin의 오류 응답은 `PreviewGatewayProblem`입니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PreviewGatewayProblem'

    PreviewUnavailable:
      description: Preview Gateway가 종료 중이거나 사용할 수 없습니다(code `preview_unavailable`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PreviewGatewayProblem'

    InternalServerError:
      description: |
        서버 내부 오류로 요청을 처리하지 못했습니다.
        응답에는 안전한 고정 설명과 requestId만 포함하며 DB 오류 문자열, SQLSTATE,
        constraint 이름 같은 내부 오류 원문은 포함하지 않습니다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ResourceId:
      type: string
      minLength: 1
      description: 내부 생성 방식에 의존하지 않는 Labbit 리소스의 opaque ID입니다.

    LoginRequest:
      type: object
      description: 사전 생성 Local Account 로그인 요청입니다.
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          description: 운영자가 사전에 생성한 Local Account의 username입니다.
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: 로그인 검증에만 사용하는 password 원문입니다. 저장하거나 로그에 기록하지 않습니다.

    Me:
      type: object
      description: 현재 로그인 사용자의 기본 인증·Organization 컨텍스트입니다.
      required: [id, username, organization, organizationRole]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        username:
          type: string
          description: 현재 로그인 사용자의 username입니다.
        organization:
          $ref: '#/components/schemas/OrganizationSummary'
        organizationRole:
          $ref: '#/components/schemas/OrganizationRole'

    OrganizationSummary:
      type: object
      description: 현재 사용자에게 안전하게 노출할 수 있는 Organization 요약입니다.
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          description: Organization 표시 이름입니다.

    OrganizationRole:
      type: string
      description: |
        Organization 관리 권한입니다.
        Class의 INSTRUCTOR/STUDENT 역할과 독립적으로 판단합니다.
      enum: [ADMIN, MEMBER]

    ClassRole:
      type: string
      description: 특정 Class 안에서의 사용자 역할입니다.
      enum: [INSTRUCTOR, STUDENT]

    ClassSummary:
      type: object
      description: Class 목록 화면에 필요한 요약 정보입니다.
      required: [id, name, myRole]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          description: Class 표시 이름입니다.
        myRole:
          $ref: '#/components/schemas/ClassRole'
        activeLabExecution:
          $ref: '#/components/schemas/LabExecutionSummary'

    ClassDetail:
      type: object
      description: Class 진입 후 필요한 현재 사용자 기준 상세 컨텍스트입니다.
      required: [id, name, myRole]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          description: Class 표시 이름입니다.
        myRole:
          $ref: '#/components/schemas/ClassRole'
        activeLabExecution:
          $ref: '#/components/schemas/LabExecutionSummary'
        myLabInstance:
          $ref: '#/components/schemas/LabInstanceSummary'

    ClassList:
      type: object
      description: 접근 가능한 Class 목록 응답입니다.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassSummary'
        nextCursor:
          type: string
          description: 다음 페이지가 없으면 생략합니다. v0.1에서는 항상 생략될 수 있습니다.

    ClassMembership:
      type: object
      description: Class에 참여 중인 사용자와 해당 Class 역할입니다.
      required: [userId, username, role]
      properties:
        userId:
          $ref: '#/components/schemas/ResourceId'
        username:
          type: string
          description: 참여 사용자의 username입니다.
        role:
          $ref: '#/components/schemas/ClassRole'

    ClassMembershipList:
      type: object
      description: 현재 사용자가 조회할 수 있는 ClassMembership 목록입니다.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassMembership'
        nextCursor:
          type: string
          description: 다음 페이지가 없으면 생략합니다. v0.1에서는 항상 생략될 수 있습니다.

    LabSpecSummary:
      type: object
      description: LabSpec 목록에서 사용하는 요약 정보입니다.
      required: [id, name, ownerUserId]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        name:
          type: string
          description: LabSpec 이름입니다.
        description:
          type: string
          description: 강사가 작성한 LabSpec 설명입니다.
        ownerUserId:
          $ref: '#/components/schemas/ResourceId'

    LabSpec:
      allOf:
        - $ref: '#/components/schemas/LabSpecSummary'
        - type: object
          description: 실제 저장된 LabSpec 상세 정의입니다.
          required: [vms, workspaceVm, internetOutbound]
          properties:
            vms:
              type: array
              minItems: 1
              description: 이 실습에서 생성할 VM Role 구성입니다.
              items:
                $ref: '#/components/schemas/VmRoleSpec'
            workspaceVm:
              $ref: '#/components/schemas/WorkspaceVmSelector'
            internetOutbound:
              type: boolean
              description: 사용자 LabInstance에서 Internet Outbound를 허용할지 여부입니다.
            startupScript:
              type: string
              description: |
                사용자가 선택적으로 작성하는 Startup Script입니다.
                Credential이나 Secret 원문을 직접 포함하지 않습니다.

    LabSpecWrite:
      type: object
      description: LabSpec 생성·수정에 사용하는 편집 가능 정의입니다.
      required: [name, vms, workspaceVm, internetOutbound]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: LabSpec 이름입니다.
        description:
          type: string
          description: 실습 목적이나 안내를 위한 설명입니다.
        vms:
          type: array
          minItems: 1
          description: 실습에서 생성할 VM Role 목록입니다.
          items:
            $ref: '#/components/schemas/VmRoleSpec'
        workspaceVm:
          $ref: '#/components/schemas/WorkspaceVmSelector'
        internetOutbound:
          type: boolean
          description: 사용자 LabInstance에서 Internet Outbound를 허용할지 여부입니다.
        startupScript:
          type: string
          description: |
            사용자가 선택적으로 작성하는 Startup Script입니다.
            Credential이나 Secret 원문을 직접 포함하지 않습니다.

    VmRoleSpec:
      type: object
      description: LabSpec 안에서 동일한 역할과 Image/Size를 공유하는 VM 구성입니다.
      required: [role, imageRef, sizeRef, count]
      additionalProperties: false
      properties:
        role:
          type: string
          minLength: 1
          description: 'LabSpec 내부의 논리 VM 역할입니다. 예: control, worker.'
        name:
          type: string
          description: 사용자에게 표시할 선택적 VM 역할 이름입니다.
        imageRef:
          type: string
          minLength: 1
          description: 기관에 허용된 Image를 가리키는 논리 참조값입니다.
        sizeRef:
          type: string
          minLength: 1
          description: 기관에 허용된 Size/Flavor를 가리키는 논리 참조값입니다.
        count:
          type: integer
          minimum: 1
          description: 이 역할로 생성할 VM 수입니다.

    WorkspaceVmSelector:
      type: object
      description: Editor와 기본 Preview의 기준이 되는 Workspace VM 하나를 지정합니다.
      required: [role, instanceIndex]
      additionalProperties: false
      properties:
        role:
          type: string
          minLength: 1
          description: '`vms`에 선언된 role 중 하나를 지정합니다.'
        instanceIndex:
          type: integer
          minimum: 0
          description: 선택한 role의 count 안에서 0부터 시작하는 VM 인덱스입니다.

    LabSpecList:
      type: object
      description: 조회 가능한 LabSpec 목록 응답입니다.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LabSpecSummary'
        nextCursor:
          type: string
          description: 다음 페이지가 없으면 생략합니다. v0.1에서는 항상 생략될 수 있습니다.

    CreateLabExecutionRequest:
      type: object
      description: |
        새 LabExecution을 시작하기 위한 요청입니다.
        사용할 LabSpec과 이번 실행에 참여할 학생을 강사가 명시적으로 선택합니다.
      required: [labSpecId, targetStudentIds]
      additionalProperties: false
      properties:
        labSpecId:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: 이번 LabExecution 생성 기준으로 사용할 LabSpec ID입니다.
        targetStudentIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: |
            이번 LabExecution에 참여할 학생의 User ID 목록입니다.

            대상 Class에 STUDENT Membership이 있는 사용자만 지정할 수 있습니다.
            최소 1명 이상 선택해야 하며 같은 User ID를 중복해서 지정할 수 없습니다.

            요청이 정상 접수되면 이 학생 집합을 현재 LabExecution의 대상 집합으로 고정합니다.
            실행 시작 이후 Class Membership이 추가·삭제·변경되어도 현재 실행에는
            자동으로 반영하지 않으며 다음 LabExecution부터 적용합니다.

            이 목록에 포함된 학생에게만 학생용 LabInstance를 생성합니다.
          items:
            $ref: '#/components/schemas/ResourceId'

    LabExecutionSummary:
      type: object
      description: 활성 실습 실행을 표시하기 위한 LabExecution 요약입니다.
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        status:
          $ref: '#/components/schemas/LabExecutionStatus'

    LabExecution:
      type: object
      description: 한 번의 Provision으로 시작된 Class 실습 실행입니다.
      required:
        - id
        - classId
        - labSpecId
        - instructorUserId
        - targetUserIds
        - status
        - labInstances
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        classId:
          $ref: '#/components/schemas/ResourceId'
        labSpecId:
          $ref: '#/components/schemas/ResourceId'
        instructorUserId:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: 이 LabExecution을 시작한 강사의 User ID입니다.
        targetUserIds:
          type: array
          description: |
            LabExecution 시작 시 고정된 대상 학생 User ID 목록입니다.
            이후 Class Membership 변경으로 자동 변경되지 않습니다.
          items:
            $ref: '#/components/schemas/ResourceId'
        status:
          $ref: '#/components/schemas/LabExecutionStatus'
        labInstances:
          type: array
          description: 이 LabExecution에 속한 강사·학생 LabInstance 목록입니다.
          items:
            $ref: '#/components/schemas/LabInstanceSummary'

    LabExecutionStatus:
      type: string
      description: |
        LabExecution 전체의 큰 lifecycle 상태입니다.

        현재 구현에서 PROVISIONING, ACTIVE, CLEANING_UP, COMPLETED, ERROR 등의
        값을 사용할 수 있습니다. 향후 상태가 추가될 수 있으므로 클라이언트는
        알 수 없는 값을 받아도 안전하게 fallback 해야 합니다.

    LabInstanceSummary:
      type: object
      description: 사용자 한 명에게 할당된 LabInstance의 요약입니다.
      required: [id, userId, status, generation]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        userId:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: 이 LabInstance를 사용하는 사용자 ID입니다.
        status:
          $ref: '#/components/schemas/LabInstanceStatus'
        generation:
          type: integer
          minimum: 1
          description: Reset으로 Provider 리소스를 재생성할 때 증가하는 세대 번호입니다.

    LabInstance:
      allOf:
        - $ref: '#/components/schemas/LabInstanceSummary'
        - type: object
          description: 사용자별 실습 환경의 상세 정보입니다.
          required: [labExecutionId]
          properties:
            labExecutionId:
              allOf:
                - $ref: '#/components/schemas/ResourceId'
              description: 이 LabInstance가 속한 LabExecution ID입니다.

    LabInstanceStatus:
      type: string
      description: |
        사용자 실습 환경 자체의 큰 lifecycle 상태입니다.

        현재 제품 상태는 PENDING, PROVISIONING, READY, ERROR, DELETING을 포함합니다.
        Operation 상태와 구분하며, 향후 값이 추가될 수 있으므로 클라이언트는
        알 수 없는 상태에 대한 fallback을 제공해야 합니다.

    OperationAccepted:
      type: object
      description: 비동기 변경 요청이 접수되었거나 기존 요청 결과가 재사용되었음을 나타냅니다.
      required: [operationId, target]
      properties:
        operationId:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: 요청의 비동기 처리 상태를 조회할 Operation ID입니다.
        target:
          $ref: '#/components/schemas/ResourceRef'

    Operation:
      type: object
      description: Provision, Reset, Cleanup 같은 장시간 변경 작업의 durable 상태입니다.
      required: [id, type, status, target, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        type:
          $ref: '#/components/schemas/OperationType'
        status:
          $ref: '#/components/schemas/OperationStatus'
        stage:
          type: string
          description: |
            UI 안내와 관측에 사용할 수 있는 확장 가능한 세부 진행 단계입니다.
            Worker, Queue, Provider 구현에 독립적인 값으로 표현합니다.

            클라이언트는 이 값 하나만으로 작업의 성공·실패나 제품 정합성을 판단하지 않고
            Operation status와 대상 리소스 상태를 함께 확인해야 합니다.
        target:
          $ref: '#/components/schemas/ResourceRef'
        error:
          $ref: '#/components/schemas/OperationError'
        createdAt:
          type: string
          format: date-time
          description: Operation을 생성한 시각입니다.
        updatedAt:
          type: string
          format: date-time
          description: Operation 상태를 마지막으로 갱신한 시각입니다.
        startedAt:
          type: string
          format: date-time
          description: 실제 처리를 시작한 시각입니다. 아직 시작하지 않았다면 생략할 수 있습니다.
        finishedAt:
          type: string
          format: date-time
          description: 작업을 종료한 시각입니다. 아직 종료되지 않았다면 생략할 수 있습니다.

    OperationType:
      type: string
      description: |
        Operation이 수행하는 변경 작업 종류입니다.
        현재 PROVISION, RESET, CLEANUP을 사용하며 향후 작업 종류가 추가될 수 있습니다.

    OperationStatus:
      type: string
      description: |
        Operation 처리 자체의 안정적인 큰 상태입니다.

        현재 PENDING, RUNNING, RECONCILING, SUCCEEDED, FAILED를 사용합니다.
        LabInstance lifecycle 상태와 구분하며, 향후 값이 추가될 수 있으므로
        클라이언트는 알 수 없는 값에 대한 fallback을 제공해야 합니다.

    OperationError:
      type: object
      description: 실패한 Operation에서 클라이언트에 안전하게 노출할 오류 요약입니다.
      required: [code]
      properties:
        code:
          type: string
          description: UI와 클라이언트 분기에 사용할 수 있는 안정적인 machine-readable 오류 코드입니다.
        message:
          type: string
          description: Credential이나 Provider raw payload를 포함하지 않는 정제된 사용자/운영용 요약입니다.

    ResourceRef:
      type: object
      description: Operation의 직접 대상이 되는 제품 리소스를 가리킵니다.
      required: [type, id]
      properties:
        type:
          type: string
          description: '대상 리소스 유형입니다. 예: LAB_EXECUTION, LAB_INSTANCE.'
        id:
          $ref: '#/components/schemas/ResourceId'

    TerminalTargetList:
      type: object
      description: |
        LabInstance에서 TerminalSession을 열 수 있는 VM 목록입니다. 원본은 해당 LabExecution의 immutable resolved
        CreationSnapshot이며 Provider 내부 정보는 포함하지 않습니다. 목록은 논리적 선택지이고 VM의 현재 사용 가능 여부를
        뜻하지 않습니다.
      required: [generation, workspaceVmKey, items]
      properties:
        generation:
          type: integer
          minimum: 1
          description: |
            이 목록을 판정한 시점의 LabInstance generation입니다. 화면 갱신 판단에 쓸 수 있는 정보일 뿐이며
            이후 TerminalSession 생성의 근거가 아닙니다. 클라이언트는 TerminalSession 생성 요청에 generation을 보내지 않고,
            서버는 생성 시 현재 generation을 다시 확인합니다.
        workspaceVmKey:
          type: string
          minLength: 1
          description: |
            `items` 중 Workspace VM의 `vmKey`입니다. 기본으로 선택할 VM을 고르는 hint이며 Terminal이 Workspace VM 하나에만
            열린다는 뜻이 아닙니다. 항상 `items`의 한 원소를 가리킵니다.
        items:
          type: array
          minItems: 1
          description: Terminal을 열 수 있는 모든 VM입니다. Workspace VM을 포함하며 `vmKey`는 서로 다릅니다.
          items:
            $ref: '#/components/schemas/TerminalTarget'

    TerminalTarget:
      type: object
      description: Terminal을 열 수 있는 VM 하나입니다.
      required: [vmKey, role, instanceIndex]
      properties:
        vmKey:
          type: string
          minLength: 1
          description: |
            이 VM을 가리키는 opaque 키입니다. 클라이언트는 값을 해석하거나 `role`/`instanceIndex`로 만들거나 이름 규칙에 의존하지 않고,
            서버가 반환한 값을 그대로 `CreateTerminalSessionRequest.targetVmKey`로 보냅니다.
        role:
          type: string
          minLength: 1
          description: VM의 역할입니다. 화면 표시용 정보이며 식별에는 `vmKey`만 사용합니다.
        instanceIndex:
          type: integer
          minimum: 0
          description: 같은 역할 안에서의 VM 순번입니다. 화면 표시용 정보이며 식별에는 `vmKey`만 사용합니다.

    CreateTerminalSessionRequest:
      type: object
      description: |
        TerminalSession을 만들 VM과 Browser terminal의 초기 크기입니다.
        Provider Server ID, Connector ID, generation은 받지 않습니다. 서버가 현재 상태에서 결정합니다.
      required: [targetVmKey, cols, rows]
      additionalProperties: false
      properties:
        targetVmKey:
          type: string
          minLength: 1
          description: |
            `GET /lab-instances/{labInstanceId}/terminal-targets`에서 서버가 반환한 opaque Terminal VM key(`items[].vmKey`)입니다.
            클라이언트는 값을 생성·해석하지 않고 그대로 전달합니다. 서버는 TerminalSession 생성 시 immutable CreationSnapshot
            membership과 현재 LabInstance generation의 ProviderResource를 다시 resolve/authorize합니다.
        cols:
          type: integer
          minimum: 1
          description: Browser terminal의 초기 column 수입니다. PTY 초기 크기로 Connector에 전달합니다.
        rows:
          type: integer
          minimum: 1
          description: Browser terminal의 초기 row 수입니다. PTY 초기 크기로 Connector에 전달합니다.

    TerminalSession:
      type: object
      description: |
        만들어진 TerminalSession과 Browser Terminal WSS attach token입니다.
        Browser는 `/realtime/v1/terminal`(subprotocol `labbit.terminal.v1`)에 연결한 뒤
        첫 JSON control frame `TERMINAL_ATTACH`에 `sessionToken`을 실어 attach합니다.
        WSS endpoint와 subprotocol은 고정이므로 이 응답에 포함하지 않습니다.
      required: [id, generation, sessionToken, tokenExpiresAt]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        generation:
          type: integer
          minimum: 1
          description: 이 TerminalSession이 속한 LabInstance의 Provider 리소스 세대입니다. Reset으로 generation이 바뀌면 이 TerminalSession은 더 이상 사용할 수 없습니다.
        sessionToken:
          type: string
          minLength: 1
          description: |
            이 TerminalSession과 현재 사용자에 scope된 opaque attach token입니다. 클라이언트는 값의 내부 구조에 의존하지 않습니다.
            일반 로그인 Session token이 아니며 다른 TerminalSession에 사용할 수 없습니다.

            - CSPRNG가 만든 32 bytes를 padding 없는 canonical Base64URL 문자열로 전달합니다.
            - 서버는 원문을 저장하지 않고 SHA-256 digest만 `terminal_sessions.attach_token_hash`에 저장합니다.
            - 절대 만료 시간은 발급 시점부터 8시간(`tokenExpiresAt`)입니다. 이 MVP는 token을 주기적으로 회전하거나 갱신하지 않으며
              refresh endpoint도 없습니다. 만료 전에도 TerminalSession이 `ENDED`가 되면 즉시 사용할 수 없습니다.
            - token만으로 attach할 수 없습니다. 매 attach/re-attach마다 현재 로그인 세션, 현재 사용자, 현재 Class 권한,
              LabInstance 소유, 현재 generation, TerminalSession lifecycle, token digest를 다시 확인합니다.
            - URL query string에 넣지 않습니다. 로그·trace에 기록하지 않습니다.
        tokenExpiresAt:
          type: string
          format: date-time
          description: '`sessionToken`의 절대 만료 시각입니다.'

    CreatePreviewSessionRequest:
      type: object
      description: |
        PreviewSession을 만들 Workspace VM application의 TCP port입니다.
        VM, Provider Server ID, Connector ID, generation, private address는 받지 않습니다. 서버가 현재 상태에서 결정합니다.
      required: [targetPort]
      additionalProperties: false
      properties:
        targetPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            Preview할 application이 listen하는 TCP port입니다. 서버는 Backend가 명시적으로 설정한 허용 목록에 이 값이 있을 때만
            승인하며(그렇지 않으면 `403` `preview_port_not_allowed`) 이 계약이 어떤 port를 기본값으로 정하지 않습니다.
            SSH 관리 port(`22`)는 항상 거절합니다.

    PreviewSession:
      type: object
      description: |
        만들어진 PreviewSession과 Preview Origin의 `previewUrl`입니다. VM IP/port, Provider Server ID, Connector ID를 포함하지 않습니다.
      required: [id, targetPort, previewUrl, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/ResourceId'
        targetPort:
          type: integer
          minimum: 1
          maximum: 65535
          description: 서버가 승인한 정확한 application TCP port입니다. 요청한 `targetPort`와 같습니다.
        previewUrl:
          type: string
          format: uri
          description: |
            Preview Origin의 bootstrap 경로(`/__labbit/bootstrap`)이며 **fragment**에 일회용 bootstrap credential이 있습니다.
            host는 SaaS 본 서비스 Origin과 다르고 PreviewSession마다 다릅니다. 클라이언트는 이 URL을 그대로 열기만 하며(새 탭 또는 iframe)
            fragment를 파싱하거나 query/path로 옮기거나 log·저장·analytics로 보내지 않습니다. 이 응답에서만 나가며 다시 조회할 수 없습니다.
        expiresAt:
          type: string
          format: date-time
          description: |
            PreviewSession의 절대 만료 시각입니다. 서버 구성의 TTL(생성 완료 시점부터)이며 갱신하지 않습니다. 만료·종료 뒤 Preview Origin의
            모든 요청은 `401`입니다. 만료 전에도 Workspace tunnel이 끝나면 즉시 사용할 수 없습니다.

    PreviewExchangeRequest:
      type: object
      description: Preview Origin의 `POST /__labbit/exchange` 요청입니다.
      required: [credential]
      additionalProperties: false
      properties:
        credential:
          type: string
          minLength: 1
          description: '`previewUrl`의 fragment에 있던 일회용 bootstrap credential입니다. URL query/path로 전달하지 않으며 log·저장하지 않습니다.'

    PreviewGatewayProblem:
      description: |
        Preview Origin의 Gateway가 직접 만든 오류 응답입니다(Workspace application의 응답이 아닙니다). `ProblemDetails`와 같은 형식이며
        `code`는 다음 값 중 하나이고 클라이언트는 `detail`을 parsing하지 않습니다. PreviewSession 생성의 오류 code와는 별개 집합입니다.

        - `preview_unauthenticated`(`401`): Cookie/credential이 없거나 유효하지 않음, 이미 사용·만료된 bootstrap credential, 없거나 종료·만료된 PreviewSession
        - `preview_tunnel_closed`(`502`): 요청을 처리하는 동안 Workspace tunnel이 닫힘(application이 연결을 닫음, Connector 단절, 종료). PreviewSession도 끝남
        - `preview_upstream_error`(`502`): Workspace application의 응답을 HTTP/1.1로 해석할 수 없음
        - `preview_upstream_timeout`(`504`): Workspace application이 서버 구성의 시간 안에 응답하지 않음
        - `preview_upgrade_unsupported`(`501`): HTTP Upgrade(예: Workspace application의 WebSocket)는 MVP에서 지원하지 않음
        - `method_not_allowed`(`405`): Gateway가 전달하지 않는 method(`CONNECT`, `TRACE`) 또는 예약 경로의 허용되지 않은 method
        - `not_found`(`404`): 예약된 `/__labbit/` prefix의 알 수 없는 경로
        - `invalid_request`(`400`): exchange 요청 body 형식 오류
        - `csrf_rejected`(`403`): exchange 요청의 `Origin`이 Preview Origin과 다름
        - `preview_unavailable`(`503`): Gateway가 종료 중이거나 사용할 수 없음

        Workspace application이 보낸 `404`/`500` 같은 응답은 그대로 전달하며 Gateway의 오류로 바꾸지 않습니다.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            code:
              type: string
              enum:
                - preview_unauthenticated
                - preview_tunnel_closed
                - preview_upstream_error
                - preview_upstream_timeout
                - preview_upgrade_unsupported
                - method_not_allowed
                - not_found
                - invalid_request
                - csrf_rejected
                - preview_unavailable

    WorkspaceFileTree:
      type: object
      description: Workspace의 디렉터리 하나의 직계 항목입니다. 재귀 목록, 파일 크기·권한·소유자·수정 시각은 포함하지 않습니다.
      required: [path, items]
      properties:
        path:
          type: string
          maxLength: 4096
          description: 요청한 디렉터리의 경로입니다. root이면 빈 문자열입니다. 서버가 경로를 고쳐 쓰지 않으므로 요청한 값과 같습니다.
        items:
          type: array
          description: 디렉터리의 직계 항목입니다. `name`의 UTF-8 byte 순서 오름차순입니다.
          items:
            $ref: '#/components/schemas/WorkspaceFileEntry'

    WorkspaceFileEntry:
      type: object
      description: 디렉터리 항목 하나입니다.
      required: [name, path, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 이 항목의 이름입니다(경로 segment 하나).
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: Workspace root 기준의 항목 경로입니다. 그대로 `WorkspaceFilePath` 또는 `WorkspaceDirectoryPath`로 다시 보낼 수 있습니다.
        kind:
          type: string
          enum: [file, directory]
          description: 항목의 종류입니다. 이 밖의 종류는 목록에 포함하지 않습니다.

    WorkspaceFileContent:
      type: object
      description: UTF-8 text 파일의 본문입니다. revision은 `ETag` header로 전달합니다.
      required: [path, content]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: 읽은 파일의 경로입니다. 서버가 경로를 고쳐 쓰지 않으므로 요청한 값과 같습니다.
        content:
          type: string
          description: 유효한 UTF-8이며 NUL을 포함하지 않는 파일 본문입니다.

    SaveWorkspaceFileRequest:
      type: object
      description: 저장할 UTF-8 text 파일 본문입니다.
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          description: |
            파일의 새 본문 전체입니다. 유효한 UTF-8이고 NUL을 포함하지 않아야 하며 UTF-8로 인코딩한 크기가 설정된 한도를
            넘지 않아야 합니다. 서버는 줄바꿈이나 공백을 변환하지 않습니다.

    WorkspaceFileSaved:
      type: object
      description: 저장한 파일입니다. 새 revision은 `ETag` header로 전달합니다.
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: 저장한 파일의 경로입니다.

    ProblemDetails:
      type: object
      description: 'RFC 9457 `application/problem+json` 기반의 공통 HTTP 오류 응답입니다.'
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          description: 오류 유형을 식별하는 URI reference입니다.
        title:
          type: string
          description: 오류 유형의 짧고 사람이 읽기 쉬운 제목입니다.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: 이 오류 응답의 HTTP status code입니다.
        detail:
          type: string
          description: |
            사람이 읽기 위한 안전한 오류 설명입니다.
            클라이언트는 이 문자열을 parsing하여 제어 흐름을 결정하지 않습니다.
        instance:
          type: string
          format: uri-reference
          description: 필요할 경우 이 오류 발생 건을 식별하는 URI reference입니다.
        code:
          type: string
          description: 클라이언트가 안정적으로 분기할 수 있는 확장 가능한 Labbit 오류 코드입니다.
        requestId:
          type: string
          description: 사용자나 지원 담당자에게 노출해도 되는 요청 상관관계 식별자입니다.

security:
  - sessionCookie: []
