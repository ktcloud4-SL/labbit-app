version: "0.1.6"
kind: "LabbitRuntimeContract"

scope:
  repository: "labbit-app"
  purpose: "애플리케이션과 플랫폼 사이의 Runtime 경계"
  excludes:
    - "Kubernetes Deployment/Pod 개수"
    - "Replica/HPA 값"
    - "ALB/NLB/WAF/Ingress/Gateway 구현"
    - "Istio namespace/service policy"
    - "SQS/Kafka/Valkey/KEDA 도입 여부"
    - "환경별 IaC"

artifacts:
  saas:
    executable: "labbit-server"
    logical_roles:
      - api
      - worker
      - realtime
      - preview
    note: >-
      logical role마다 책임과 lifecycle은 다르지만, v0.1은 role별로 하나의 process 또는
      Kubernetes workload를 요구하지 않습니다. 하나의 executable이 여러 role을 실행할 수 있으며,
      플랫폼은 외부 HTTP/WSS 계약을 변경하지 않고 추후 workload를 분리할 수 있습니다.
  migration:
    executable: "labbit-migrate"
    command: "up"
    lifecycle: "one-shot"
    run_by: "application rollout 전 platform/CI deployment step"
    config:
      - LABBIT_ENVIRONMENT
      - LABBIT_DATABASE_DSN_FILE
      - LABBIT_DATABASE_DSN
      - LABBIT_LOG_LEVEL
    note: >-
      db/migrations/*.sql을 적용하는 SQL Migration runner입니다. 설정 key는 saas.config와 같은 의미를 가집니다.
      labbit-server startup은 Migration을 실행하지 않으며 application replica는 migration lock을 경쟁하지 않습니다.
      image·Job·hook 등 실행 구성 방식은 이 contract에서 고정하지 않습니다.
  connector:
    executable: "labbit-connector"
    inbound_public_listener: false
    note: >-
      Connector는 고객 환경에서 실행되며 SaaS로 outbound WSS/TLS 연결을 먼저 시작합니다.
      Public inbound port는 필요하지 않습니다.
  frontend:
    type: "static-spa"
    server_process_required: false
    secret_runtime_config_allowed: false

saas:
  listeners:
    application:
      env: "LABBIT_HTTP_ADDR"
      default: ":8080"
      purpose:
        - "HTTP API"
        - "Browser WebSocket Upgrade"
        - "Connector WebSocket Upgrade"
        - "preview role이 co-located인 경우 Preview HTTP/WSS"
      public_exposure: >-
        container listener 자체는 public contract가 아닙니다. 플랫폼은 HTTPS/WSS 443
        public entry 경계를 통해 승인된 route만 노출합니다.
    admin:
      env: "LABBIT_ADMIN_ADDR"
      default: ":9090"
      public_exposure: false
      endpoints:
        liveness:
          path: "/livez"
          success_status: 200
          semantics: >-
            process 자체의 liveness만 나타냅니다. PostgreSQL, Connector 또는 OpenStack의
            일시적 장애 때문에 liveness를 실패시키지 않습니다.
        readiness:
          path: "/readyz"
          success_status: 200
          failure_status: 503
          semantics: >-
            process startup이 완료되고 활성화된 모든 role이 새 작업을 안전하게 받을 수 있어야 합니다.
            API/worker role은 사용 가능한 PostgreSQL 연결과 호환되는 schema를 요구합니다.
            모든 고객 Connector 또는 OpenStack이 online이어야 readiness가 성공하는 구조로 만들지 않습니다.
        metrics:
          path: "/metrics"
          format: "Prometheus text exposition"
          semantics: >-
            운영 metric만 노출합니다. high-cardinality resource/request/session 식별자는
            metric label로 사용할 수 없습니다.

  config:
    LABBIT_RUNTIME_ROLES:
      required: true
      secret: false
      format: "comma-separated"
      allowed:
        - api
        - worker
        - realtime
        - preview
    LABBIT_ENVIRONMENT:
      required: true
      secret: false
      examples:
        - development
        - staging
        - production
    LABBIT_HTTP_ADDR:
      required: false
      secret: false
      default: ":8080"
    LABBIT_PUBLIC_ORIGIN:
      required_when: >-
        api role enables Browser HTTP/Auth handlers,
        or realtime role enables Browser Terminal/Live WSS
      secret: false
      format: "absolute origin URL (scheme + host + optional port, no path/query/fragment)"
      examples:
        - "http://localhost:5173"
        - "https://labbit.example.com"
      note: >-
        Browser unsafe-method CSRF/Origin 검증과 Browser WebSocket Upgrade Origin 검증의 trusted target origin입니다.
        request Host/X-Forwarded-Host를 신뢰해 동적으로 결정하지 않습니다.
        개발자 PC에서는 Vite Browser origin, 공유 Local/AWS에서는 실제 public HTTPS app origin을 주입합니다.
        realtime role 때문에 이 값이 필요해지는 것이며 PostgreSQL DSN 요구를 추가하지 않습니다.
    LABBIT_ADMIN_ADDR:
      required: false
      secret: false
      default: ":9090"
    LABBIT_LOG_LEVEL:
      required: false
      secret: false
      default: "info"
    LABBIT_DATABASE_DSN:
      required: false
      secret: true
      note: "Local development용 escape hatch입니다. production에서는 사용하지 않습니다. 값을 log에 기록하지 않습니다."
    LABBIT_DATABASE_DSN_FILE:
      required_in_production_when: "api 또는 worker role이 enabled된 process, labbit-migrate"
      secret: false
      note: >-
        Production에서 우선 사용하는 입력입니다. 참조된 파일에는 플랫폼의 Secret injection
        mechanism이 제공한 PostgreSQL DSN이 들어 있습니다. 두 DSN 입력이 모두 설정되면
        file form을 우선합니다. PostgreSQL을 사용하지 않는 realtime/preview 전용 process에는 요구하지 않습니다.
    LABBIT_PREVIEW_ALLOWED_PORTS:
      required_when: "preview role이 enabled된 process"
      secret: false
      format: "comma-separated decimal TCP port list (예: 3000,8080)"
      note: >-
        PreviewSession이 승인할 수 있는 Workspace VM application port의 **Backend 명시적 허용 목록**입니다. 이 목록이 trust root이며
        숫자 범위로 자동 승인하지 않고(범위 표기는 형식 오류) 코드에 기본 port를 두지 않습니다. 3000 같은 값도 기본값이 아닙니다.
        설정하지 않았거나 비어 있으면 startup에 실패합니다(fail closed). 중복은 정규화하고 1~65535가 아닌 값·정수가 아닌 값은 형식 오류입니다.
        SSH 관리 port(22)는 목록에 있어도 Preview 대상으로 항상 거절합니다. 이 값은 process 전체의 global 정책이며 LabSpec별 port 정책이
        아닙니다(LabSpec/CreationSnapshot에는 Preview port 목록이 없음). 승인은 PreviewSession마다 정확한 port 하나에 bind됩니다.
    LABBIT_PREVIEW_SESSION_TTL:
      required_when: "preview role이 enabled된 process"
      secret: false
      format: "Go duration (0보다 큰 값)"
      note: >-
        PreviewSession의 절대 TTL(생성이 끝난 시점부터)입니다. 명시해야 하며 기본값이 없습니다. 0, 음수, 해석할 수 없는 값은 startup에 실패합니다.
        이 계약은 수치를 고정하지 않습니다.
    LABBIT_PREVIEW_ORIGIN_TEMPLATE:
      required_when: "preview role이 enabled된 process"
      secret: false
      format: "absolute origin URL template (scheme + host + optional port, no path/query/fragment), host의 첫 label이 {sessionId}"
      examples:
        - "https://{sessionId}.preview.example.com"
        - "http://{sessionId}.localhost:8080"
      note: >-
        사용자 코드가 실행되는 Preview Origin입니다. `{sessionId}` placeholder는 host의 첫 label로 정확히 한 번 있어야 하며 PreviewSession ID로 치환됩니다.
        SaaS 본 서비스 Origin(LABBIT_PUBLIC_ORIGIN)과 분리된 별도 Origin(separate-origin)이어야 하되, iframe 임베딩과 인증 격리를 위해 동일한 scheme 및 registrable domain(eTLD+1)을 공유하는 same-site여야 합니다 (예: SaaS가 https://labbit.example.com이면 Preview template은 https://{sessionId}.preview.example.com, scheme 또는 site 불일치 시 startup fail-closed). 본 서비스 host가 이 template에 일치해서도 안 됩니다. production에서는 https여야 합니다.
        Browser에 VM IP/port, Provider Server ID, Connector ID를 노출하지 않습니다. 이 예시 hostname은 실제 값이 아니며 wildcard DNS, 인증서,
        Ingress/Gateway route, production hostname은 Platform/IaC가 소유합니다. request Host는 이 template에 일치할 때만 Preview Gateway로 갑니다.
    LABBIT_SHUTDOWN_GRACE:
      required_in_production: true
      secret: false
      format: "Go duration"
      note: >-
        플랫폼 검증을 거친 graceful shutdown budget입니다. v0.1에서는 normative 값을
        고정하지 않으며 integration test 이후 terminationGracePeriodSeconds와 connection
        draining 설정을 함께 조정해야 합니다.
    OTEL_SERVICE_NAME:
      required: false
      secret: false
      default: "labbit-server"
      note: "SaaS Trace resource의 service.name입니다. component와 environment도 식별 가능해야 합니다."
    OTEL_TRACES_EXPORTER:
      required: false
      secret: false
      default: "none"
      allowed:
        - none
        - otlp
      note: >-
        none은 로컬 개발/명시적 export 비활성화용 Labbit 기본값이며 Context 전달을 끄지 않습니다.
        중앙 Trace 인수 검증 환경은 플랫폼이 otlp로 명시적으로 활성화합니다.
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:
      required_when: "OTEL_TRACES_EXPORTER=otlp"
      secret: false
      format: "URL"
      note: >-
        SaaS 전용 Collector 수신 주소입니다. 자격증명은 URL에 넣지 않습니다.
        HTTP/protobuf를 선택하면 /v1/traces를 포함한 최종 Trace URL을 주입합니다.
        실제 주소·TLS·필요한 인증 주입은 플랫폼이 관리하며 Connector에는 주입하지 않습니다.
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:
      required_when: "OTEL_TRACES_EXPORTER=otlp"
      secret: false
      allowed:
        - grpc
        - http/protobuf
      note: >-
        첫 통합 전에 개발·운영이 SDK exporter와 Collector receiver가 같은 protocol을
        사용하도록 선택·검증합니다. 이 계약은 모든 SDK 환경변수가 자동 적용된다고 보장하지 않습니다.
    OTEL_EXPORTER_OTLP_TRACES_HEADERS:
      required: false
      secret: true
      format: "OpenTelemetry OTLP header list"
      note: >-
        Collector가 bearer/API-key 등 application-layer header 인증을 요구할 때 플랫폼이
        Secret으로 주입합니다. 값 원문은 로그·진단·Confluence/Git에 기록하지 않습니다.
    OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE:
      required: false
      secret: false
      format: "PEM CA certificate file path"
      note: >-
        Collector TLS가 시스템 기본 trust store에 없는 CA를 사용할 때 플랫폼이 PEM CA 파일을
        mount하고 이 경로를 주입합니다. 인증서 본문을 환경변수 값으로 넣지 않습니다.
    OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE:
      required: false
      secret: false
      format: "PEM client certificate file path"
      note: >-
        Collector가 mTLS client certificate를 요구할 때 플랫폼이 certificate 파일을 mount하고
        이 경로를 주입합니다.
    OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY:
      required: false
      secret: false
      format: "PEM client private key file path"
      note: >-
        Collector가 mTLS를 요구할 때 플랫폼이 Secret으로 private key 파일을 mount하고
        이 경로를 주입합니다. 파일 내용은 로그·진단에 기록하지 않습니다.

  database:
    required_by_roles:
      - api
      - worker
    dsn_requirement: >-
      api/worker role이 enabled된 process와 labbit-migrate는 LABBIT_DATABASE_DSN_FILE 또는
      LABBIT_DATABASE_DSN이 없으면 startup에 실패합니다. production에서는 LABBIT_DATABASE_DSN_FILE만 사용합니다.
      PostgreSQL을 사용하지 않는 realtime/preview 전용 process는 DSN 입력을 요구하지 않습니다.
    not_required_by_roles:
      - realtime
      - preview
    startup_migration: false
    migration_source: "db/migrations/*.sql"
    migration_execution: >-
      application rollout 전에 별도의 platform/CI migration step에서 labbit-migrate up을 실행합니다.
      Application replica들이 startup 시 서로 경쟁하며 AutoMigration을 실행해서는 안 됩니다.
    compatibility: >-
      database schema가 해당 application version이 지원하는 compatibility 범위를 벗어나면
      process는 startup/readiness에 실패해야 합니다.
    schema_compatibility:
      compatible_when: >-
        application build에 포함된 모든 migration이 같은 checksum으로 적용되어 있으면 호환입니다.
        build가 모르는 더 높은 version의 적용 기록은 그 자체로 비호환으로 보지 않습니다.
      rolling_invariant: >-
        정상 rolling deployment에서 application rollout보다 먼저 실행하는 migration은 현재 배포 중인
        application version과 backward-compatible해야 합니다. 순서는 old app → backward-compatible
        migration → old/new app 일시 공존 → new app rollout입니다.
      excluded_from_rolling:
        - "old application이 사용하는 column/table 삭제"
        - "의미가 호환되지 않는 constraint 변경"
        - "old application query를 깨뜨리는 schema 변경"
      excluded_change_process: >-
        backward-incompatible/destructive migration은 normal rolling path로 배포하지 않습니다. D-22에 따라
        maintenance window, 명시적인 application/schema 전환 순서, restore/recovery 계획,
        실제 호환성 검증을 거칩니다.
      note: >-
        migration별 호환성 metadata는 두지 않습니다. 이 invariant는 review와 integration validation으로 확인합니다.

  realtime:
    endpoints:
      browser_terminal:
        path: "/realtime/v1/terminal"
        subprotocol: "labbit.terminal.v1"
        contract: "contracts/realtime/README.md"
      connector_terminal_data:
        path: "/connector/v1/terminal-data"
        subprotocol: "labbit.connector-terminal.v1"
        contract: "contracts/connector/README.md"
    database_required: false
    note: >-
      realtime role은 PostgreSQL을 application dependency로 요구하지 않으며 DB DSN 입력도 요구하지 않습니다.
      Browser Session, 현재 Class 권한, TerminalSession lifecycle, Connector credential 인증과 Connector Control 경로 같은
      DB-backed authority는 realtime 구현이 직접 조회하지 않고 process에 주입된 좁은 interface로만 사용합니다.
    v0_1_topology:
      required_co_located_roles:
        - api
      authority_provider: >-
        v0.1에서 위 authority는 같은 process에서 api role이 제공합니다(PostgreSQL, Browser 인증, TerminalSession 권한/lifecycle,
        Connector Control Registry/Router). 따라서 Terminal 기능이 동작하려면 realtime role과 api role이 같은 process에서 함께
        enabled되어야 합니다(예: LABBIT_RUNTIME_ROLES=api,realtime).
      realtime_without_api: >-
        realtime만 enabled된 process는 authority가 없으므로 Terminal/Live route를 제공하지 않고 /readyz가 실패합니다.
        unauthenticated 또는 부분 동작 route를 열지 않으며 PostgreSQL DSN을 새로 요구하지도 않습니다.
      api_without_realtime: >-
        api만 enabled된 process에는 Terminal Relay가 없으므로 TerminalSession 생성/종료 HTTP가 503(code terminal_unavailable)입니다.
      not_provided:
        - "별도 realtime workload용 internal authorization RPC"
        - "service discovery / Valkey 기반 Terminal owner routing"
        - "multi-replica Terminal owner routing과 session affinity"
      note: >-
        Relay의 TerminalSession 연결 상태와 Browser/Connector attachment는 process 안의 ephemeral 상태입니다.
        process가 비정상 종료되면 이 상태를 복구하지 않습니다. 정상 종료에서는 active TerminalSession을 SERVICE_RESTARTING으로 종료합니다.
        workload 분리와 multi-replica routing은 후속 Platform/Runtime 결정 전까지 지원한다고 주장하지 않습니다.

  file:
    owner_role: "api"
    endpoints:
      browser_http:
        base_path: "/api/v1/lab-instances/{labInstanceId}/files"
        contract: "contracts/http/openapi.yaml"
      connector_file_data:
        path: "/connector/v1/file-data"
        subprotocol: "labbit.connector-file.v1"
        contract: "contracts/connector/README.md#7a-workspace-file-transport"
    database_required: true
    note: >-
      Workspace File Tree/Read/Save는 api role이 소유합니다. realtime role이 필요하지 않으며 Browser HTTP 요청, 권한 판정,
      Connector Control Registry/Router, Connector File Data WSS가 같은 process에 있습니다. 요청마다 pending 상태(요청 ID, 대기 중인
      attach, 진행 중인 Data WSS)를 process 안의 memory에만 두며 PostgreSQL이나 별도 FileSession table에 저장하지 않습니다.
      process가 비정상 종료되면 진행 중인 요청은 실패하며 복구하지 않고, 정상 종료에서는 새 요청을 받지 않고 진행 중인 요청의 Data WSS를
      닫습니다. 파일 본문, 디렉터리 목록, 경로는 persistent Control WSS, PostgreSQL, log, trace, metric label에 남기지 않습니다.
    v0_1_topology:
      not_provided:
        - "multi-replica File owner routing과 session affinity"
        - "service discovery / Valkey 기반 Control connection owner 조회"
      note: >-
        Connector File Data WSS는 해당 요청의 FILE_OPEN을 보낸 process에 도착해야 합니다. 여러 replica에서 이를 보장하는 routing은
        후속 Platform/Runtime 결정 전까지 지원한다고 주장하지 않습니다.
    limits:
      max_file_bytes:
        configurable: true
        note: >-
          Workspace file 크기 한도(HTTP 413)는 process 구성이며 이 contract가 수치를 고정하지 않습니다. 현재 구현은 보수적인 기본값을
          사용하고 테스트에서 주입할 수 있습니다. 이 값은 API compatibility guarantee가 아닙니다.

  preview:
    owner_roles:
      gateway: "preview"
      session_authority: "api"
    endpoints:
      browser_http:
        base_path: "/api/v1/lab-instances/{labInstanceId}/preview-sessions"
        contract: "contracts/http/openapi.yaml"
      preview_origin:
        host_template_env: "LABBIT_PREVIEW_ORIGIN_TEMPLATE"
        reserved_prefix: "/__labbit/"
        bootstrap_path: "/__labbit/bootstrap"
        exchange_path: "/__labbit/exchange"
        contract: "contracts/http/openapi.yaml"
      connector_preview_data:
        path: "/connector/v1/preview-data"
        subprotocol: "labbit.connector-preview.v1"
        contract: "contracts/connector/README.md#7b-preview-transport"
    connector_capability: "preview-v1"
    database_required: false
    note: >-
      PreviewSession 생성·종료와 DB-backed authority(현재 User, LabInstance 소유, 현재 ClassMembership, READY, CreationSnapshot, 현재 generation의
      ProviderResource, Connector)는 `api` role이, Preview Origin의 Browser 인증·Gateway proxy·Connector Preview Data tunnel은 `preview` role이 소유합니다.
      preview role 구현은 PostgreSQL을 application dependency로 요구하지 않으며 DB DSN 입력도 요구하지 않습니다. DB-backed authority는 preview 구현이
      직접 조회하지 않고 process에 주입된 좁은 interface로만 사용합니다. PreviewSession(session/bootstrap/Cookie digest, tunnel)은 process 안의 ephemeral
      상태이며 PostgreSQL이나 별도 PreviewSession table에 저장하지 않고 process 비정상 종료 뒤 복구하지 않습니다. Preview 본문·경로·query·Cookie는
      persistent Control WSS, PostgreSQL, log, trace, metric label에 남기지 않습니다. Preview Origin은 같은 application listener(LABBIT_HTTP_ADDR)에서
      Host로 구분해 제공합니다(SaaS 본 서비스 요청과 섞이지 않음).
    v0_1_topology:
      required_co_located_roles:
        - api
      authority_provider: >-
        v0.1에서 위 authority는 같은 process에서 api role이 제공합니다. 따라서 Preview 기능이 동작하려면 preview role과 api role이 같은 process에서
        함께 enabled되어야 합니다(예: LABBIT_RUNTIME_ROLES=api,preview). 이것은 v0.1의 제약이며 PreviewSession ownership을 api에 두기로 한 영구 결정이 아닙니다.
      preview_without_api: >-
        preview만 enabled된 process는 authority가 없으므로 Preview route를 제공하지 않고 /readyz가 실패합니다. 인증 없는 route를 열지 않으며 PostgreSQL DSN을
        새로 요구하지도 않습니다.
      api_without_preview: >-
        api만 enabled된 process에는 Preview Gateway가 없으므로 PreviewSession 생성/종료 HTTP가 503(code preview_unavailable)입니다.
      not_provided:
        - "Redis/Valkey 등 distributed PreviewSession store"
        - "별도 preview workload용 internal authorization RPC"
        - "multi-replica PreviewSession owner routing과 session affinity"
        - "Preview Origin wildcard DNS/TLS/Ingress 구현 (Platform/IaC 소유)"
      note: >-
        Connector Preview Data WSS와 Browser Preview 요청은 해당 PreviewSession의 PREVIEW_OPEN을 보낸 process에 도착해야 합니다. 여러 replica에서 이를
        보장하는 routing은 후속 Platform/Runtime 결정 전까지 지원한다고 주장하지 않습니다.
    limits:
      session_ttl:
        configurable: true
        env: "LABBIT_PREVIEW_SESSION_TTL"
        note: "수치는 process 구성이며 API compatibility guarantee가 아닙니다."
      allowed_ports:
        configurable: true
        env: "LABBIT_PREVIEW_ALLOWED_PORTS"
        note: "global Backend 정책이며 LabSpec별 정책이 아닙니다."
      bootstrap_credential:
        note: >-
          일회용이며 짧은 시간 안에 교환해야 합니다. 구현의 보수적인 기본 시간이 있고 테스트에서 주입할 수 있으며 이 값은 계약 수치가 아닙니다.
          PreviewSession TTL보다 길지 않습니다.

  shutdown:
    signals:
      - SIGTERM
      - SIGINT
    common_sequence:
      - "readiness를 false로 전환합니다."
      - "종료 중인 role이 새 작업을 받지 않도록 중단합니다."
      - "이미 수락한 작업은 LABBIT_SHUTDOWN_GRACE 안에서 drain하거나 완료합니다."
      - "가장 안전하게 확인된 durable state를 영속한 뒤 종료합니다."
    api:
      rules:
        - "draining이 시작된 뒤에는 새 Provider mutation 등록을 거부합니다."
        - "안전한 경우 bounded in-flight HTTP request가 완료되도록 허용합니다."
    worker:
      rules:
        - "새 PENDING operation_item을 claim하지 않습니다."
        - "Connector/OpenStack 호출 중 PostgreSQL transaction을 열어 둔 채 유지하지 않습니다."
        - "가능하면 종료 전에 확인된 결과를 영속합니다."
        - >-
          shutdown/restart 시 Provider 결과가 불명확하면 retry 전에 실제 OpenStack state를
          Reconcile합니다. lease expiry만으로 blind replay를 허용하지 않습니다.
    realtime:
      rules:
        - "종료 중인 instance에서 새 WebSocket Upgrade를 받지 않습니다."
        - "shutdown budget 안에서 기존 Browser/Connector realtime connection을 drain합니다."
        - >-
          drain 시 active TerminalSession은 SERVICE_RESTARTING 사유로 종료하고 Browser에 TERMINAL_SESSION_ENDED를 전달합니다.
          중앙 connection draining은 Browser 비정상 단절 후 60초 PTY grace와 별개입니다.
    preview:
      rules:
        - "종료 중인 instance에서 새 Preview connection/session을 받지 않습니다."
        - "가능하면 shutdown budget 안에서 active proxy connection을 drain합니다."
        - >-
          drain 시 active PreviewSession은 SERVICE_RESTARTING 사유로 종료하고 Connector에 PREVIEW_CLOSE를 보낸 뒤(Control connection이 열려 있는 동안)
          Preview Data WSS와 진행 중인 proxy 요청을 끝냅니다. Preview 상태는 process 안의 ephemeral 상태이므로 복구하지 않습니다.

  observability:
    logs:
      format: "JSON object per line"
      destinations:
        - stdout
        - stderr
      required_base_fields:
        - timestamp
        - level
        - message
        - service
        - component
        - version
        - environment
      correlation_fields_when_known:
        - trace_id
        - request_id
        - operation_id
        - lab_instance_id
        - connector_id
        - terminal_session_id
        - live_session_id
        - preview_session_id
      operation_fields_when_known:
        - operation_type
        - stage
        - status
        - error_code
        - duration_ms
      forbidden_content:
        - "OpenStack Credential 또는 Keystone Token"
        - "Connector Credential 원문"
        - "Authorization header"
        - "사용자 Password 원문"
        - "Browser/Session/Terminal Token 원문"
        - "Secret을 포함한 Provider raw payload"
        - "Terminal INPUT/OUTPUT"
        - "Live OUTPUT"
        - "workspace file 본문/source code"
        - "workspace file 경로와 디렉터리 목록"
    tracing:
      instrumentation: "OpenTelemetry"
      propagation: "W3C Trace Context"
      exporter: "OTLP"
      trace_backend_is_application_dependency: false
      minimum_boundaries:
        - "HTTP request / Operation 등록"
        - "OperationItem Worker 처리"
        - "Connector Control command 전송 / ACK·PROGRESS·RESULT 수신"
      durable_context:
        source: "operations.traceparent / operations.tracestate"
        migration: "db/migrations/000006_operation_trace_context.sql"
        nullable: true
        rules:
          - "새 Operation을 등록할 때 현재 SaaS Span Context를 직렬화해 같은 transaction에 저장합니다."
          - "Worker는 저장된 Context를 복원하고 자신의 lifecycle을 가진 새 Span을 만듭니다."
          - "Idempotency replay는 원본 Context를 덮어쓰지 않고 Trace metadata를 request fingerprint에 넣지 않습니다."
          - "재시작/재처리에서는 새 Span ID를 사용하며 operation_id로 계속 대조합니다."
      failure_policy:
        fail_operation_on_invalid_context: false
        fail_operation_on_export_error: false
        collector_required_for_liveness_or_readiness: false
        rules:
          - "유효하지 않은 Context는 폐기하고 SaaS는 필요 시 새 Trace를 시작합니다. operation_id는 유지합니다."
          - "Exporter는 제한된 비동기 Queue·timeout을 사용하고 관측 장애로 업무 처리를 무기한 대기시키지 않습니다."
          - "Trace 전용 설정 오류는 안전한 진단 후 export를 비활성화하며 업무 필수 설정 검증과 구분합니다."
          - "종료 flush는 남은 shutdown budget 안에서만 수행하고 durable 업무 상태 저장을 우선합니다."
      note: >-
        D-25의 중앙 Trace 인수 검증은 유효한 Context와 수집 대상으로 선택된 실행을 기준으로 합니다.
        Span 이름·Sampling 비율·보존기간은 구현/플랫폼 검증에서 관리합니다.
        HTTP Span 종료는 비동기 Trace 연결의 종료가 아니며 HTTP request cancellation을 Worker 실행에 재사용하지 않습니다.
        Collector 장애·미수집·프로세스 crash 때 완전한 Trace를 보장하지 않습니다.
    metrics:
      examples:
        - "HTTP request count/latency/5xx"
        - "Operation stage/result/duration"
        - "Connector ONLINE/OFFLINE 및 heartbeat health"
        - "현재 WebSocket connection 수"
      allowed_label_examples:
        - service
        - component
        - operation_type
        - stage
        - result
        - environment
      forbidden_label_examples:
        - trace_id
        - request_id
        - operation_id
        - lab_instance_id
        - connector_id
        - terminal_session_id
        - live_session_id
        - preview_session_id

connector:
  network:
    outbound_only_to_saas: true
    public_saas_port: 443
    transport: "WSS/TLS"
    control_path: "/connector/v1/control"
    subprotocol: "labbit.connector.v1"
  config:
    LABBIT_SAAS_BASE_URL:
      required: true
      secret: false
      note: "HTTPS base URL입니다. WSS endpoint는 Git Connector Contract를 기준으로 파생합니다."
    LABBIT_CONNECTOR_ID:
      required: true
      secret: false
    LABBIT_CONNECTOR_CREDENTIAL_FILE:
      required: true
      secret: false
      note: "파일에는 Connector Credential 원문이 들어 있으며 고객 환경 Secret 경계 안에 유지해야 합니다."
    LABBIT_PROVIDER_CONFIG_FILE:
      required: true
      secret: false
      note: >-
        고객 환경에만 존재하는 Provider 설정 파일 경로입니다. 파일에 OpenStack Credential이
        포함될 수 있으며, 내용은 중앙 SaaS나 log로 보내지 않습니다.
    LABBIT_LOG_LEVEL:
      required: false
      secret: false
      default: "info"
    LABBIT_OPENSTACK_SSH_KNOWN_HOSTS_FILE:
      required_when: "production terminal sessions are enabled"
      secret: false
      note: "OpenStack VM SSH Host Key 검증용 known_hosts 파일 경로입니다. 프로덕션 환경에서 필수입니다."
    LABBIT_OPENSTACK_SSH_USERNAME:
      required: false
      secret: false
      default: "ubuntu"
      note: "OpenStack VM SSH 접속에 사용할 기본 사용자 계정입니다."
    LABBIT_OPENSTACK_SSH_PRIVATE_KEY_FILE:
      required_when: "production terminal sessions are enabled with private key auth"
      secret: true
      note: "OpenStack VM SSH 접속에 사용할 Private Key 파일 경로입니다."
  heartbeat:
    interval: "15s"
    saas_offline_after: "45s"
    note: "값은 Connector wire decision에서 정의하며 configurable하게 유지합니다."
  observability:
    log_format: "JSON object per line"
    central_raw_log_shipping_required: false
    central_raw_metric_shipping_required: false
    central_raw_trace_shipping_required: false
    tracing:
      mode: "propagation-only"
      propagation: "W3C Trace Context"
      central_export_enabled: false
      wire_contract: "contracts/connector/README.md#9-공통-correlation"
    note: >-
      SaaS는 Control WSS를 통해 이미 수신하는 metadata를 중앙에서 관측합니다.
      Connector는 명령별 Context를 ACK/PROGRESS/RESULT와 로컬 로그까지 유지하며
      중앙 OTLP 연결/인증/exporter를 추가하지 않습니다. OpenStack 내부 상세 Span은 중앙 수집하지 않습니다.
      raw log/metric/trace는 중앙 상시 반출하지 않고 필요할 때 동일 correlation ID로 로컬 로그를 대조합니다.

frontend:
  runtime:
    output: "Vite static production build"
    server_side_rendering_required: false
    rules:
      - "Frontend build/runtime 설정에 Secret을 포함하지 않습니다."
      - "환경별 public URL/configuration은 플랫폼이 제공할 수 있습니다."
      - "HTTP/WSS 동작은 deployment topology가 아니라 Git OpenAPI와 realtime contract를 따릅니다."

platform_responsibilities:
  - "immutable application/container artifact를 build하고 version을 식별합니다."
  - "Secret 값을 Git에 commit하지 않고 secret/non-secret configuration을 주입합니다."
  - "승인된 public HTTPS/WSS 443 route를 application listener에 연결합니다."
  - "admin listener를 cluster/operations 경계 안에 비공개로 유지합니다."
  - "/livez와 /readyz를 기준으로 Kubernetes probe를 구성합니다."
  - "/metrics를 public에 노출하지 않고 scrape합니다."
  - "role별 검증 후 Helm/IaC에서 replica/HPA/workload 경계를 결정합니다."
  - "LABBIT_SHUTDOWN_GRACE를 connection draining 및 terminationGracePeriodSeconds와 조정합니다."
  - "application rollout 전에 labbit-migrate up을 별도의 deployment/CI step으로 한 번 실행합니다."
  - "D-23/D-25 민감정보 규칙에 따라 stdout/stderr JSON log를 수집합니다."
  - "SaaS에만 OTLP endpoint/protocol과 필요한 header·CA·mTLS certificate/key 입력을 Secret/file mount로 주입하고 Collector·Trace 저장/조회 경로를 운영합니다."
  - "Trace 수집 검증 환경에서 otlp export를 활성화하고 Sampling·보존·비용·Log correlation을 개발팀과 검증합니다."
  - "RDS connectivity, backup/restore, DR, DNS/TLS, deployment rollback을 관리합니다."

non_guarantees:
  - >-
    이 contract는 application, Kubernetes deployment, database migration,
    graceful shutdown 또는 multi-replica routing이 이미 구현·검증되었다고 주장하지 않습니다.
  - >-
    v0.1.1의 Trace 설정/전파 계약은 OTel SDK 초기화, OTLP exporter, Operation Context 저장/복원,
    Connector propagation 또는 Tempo E2E가 이미 구현·검증되었다는 뜻이 아닙니다.
  - >-
    shutdown duration, replica count, HPA threshold, load-balancer timeout처럼 platform/integration
    validation에 맡긴 값은 API compatibility guarantee가 아닙니다.
