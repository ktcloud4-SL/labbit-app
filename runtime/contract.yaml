version: "0.1.13"
kind: "LabbitRuntimeContract"

scope:
  repository: "labbit-app"
  purpose: "애플리케이션과 플랫폼 사이의 Runtime 경계"
  excludes:
    - "Kubernetes Deployment/Pod 개수"
    - "Replica/HPA 값"
    - "ALB/NLB/WAF/Ingress/Gateway 구현"
    - "Istio namespace/service policy"
    - "SQS/Kafka/Valkey/KEDA 도입 여부"
    - "환경별 IaC"

artifacts:
  saas:
    executable: "labbit-server"
    logical_roles:
      - api
      - worker
      - realtime
      - preview
    note: >-
      logical role마다 책임과 lifecycle은 다르지만, v0.1은 role별로 하나의 process 또는
      Kubernetes workload를 요구하지 않습니다. 하나의 executable이 여러 role을 실행할 수 있으며,
      플랫폼은 외부 HTTP/WSS 계약을 변경하지 않고 추후 workload를 분리할 수 있습니다.
  migration:
    executable: "labbit-migrate"
    command: "up"
    lifecycle: "one-shot"
    run_by: "application rollout 전 platform/CI deployment step"

    config:
      - LABBIT_ENVIRONMENT
      - LABBIT_DATABASE_DSN_FILE
      - LABBIT_DATABASE_DSN
      - LABBIT_LOG_LEVEL
    note: >-
      db/migrations/*.sql을 적용하는 SQL Migration runner입니다. 설정 key는 saas.config와 같은 의미를 가집니다.
      labbit-server startup은 Migration을 실행하지 않으며 application replica는 migration lock을 경쟁하지 않습니다.
      image·Job·hook 등 실행 구성 방식은 이 contract에서 고정하지 않습니다.
  connector:
    executable: "labbit-connector"
    inbound_public_listener: false
    note: >-
      Connector는 고객 환경에서 실행되며 SaaS로 outbound WSS/TLS 연결을 먼저 시작합니다.
      Public inbound port는 필요하지 않습니다.
  dr_worker_control:
    executable: "labbit-dr-control"
    lifecycle: "trusted operator one-shot; default preview, no external I/O"
    contract: "runtime/dr-control.md"
    status: "AWS CLI/PG operator adapter candidate; offline tests only, live collectors and deployment not accepted"
    commands: [resume, inspect]
    authority: >-
      보호된 로컬 Policy의 exact STS Account/ARN/Principal/Scope/Action allowlist를 확인합니다.
      새 Resume는 별도 Ed25519 승인·관측 키, 고정 S3 VersionId·원본 SHA·크기 및 요청 binding/TTL을 검증합니다.
      신뢰 수집자의 signed LIVE_READBACK을 확인하는 포트이며 실제 Fencing/전체 Pod 관측 수집 자체를 구현하지 않습니다.
      preview가 기본이며 --execute와 Policy EnableExecution=true가 모두 필요합니다. 예제·테스트는 운영 승인이 아닙니다.
      Policy/키/DSN/실행 파일/AWS profile의 변경 권한은 제어 대상 서비스 사용자와 분리된 trusted operator에게만 줍니다.
    boundaries: >-
      공개 HTTP API·Web UI·서버 startup·배포 pipeline에 연결하지 않습니다. SaaS/Connector HTTP/WSS 계약은 변경하지 않습니다.
      자동 Pause/maintenance open/GitOps apply/DB promotion/DNS/Slack/전역 DR lock/실제 safety collector는 제공하지 않습니다.
      같은 명령 APPLIED 재조회도 현재 신원·권한을 확인하며 receipt를 새 실행 권한으로 사용하지 않습니다.
      INTENT 결과 불명은 자동 Apply/재시도하지 않습니다. 네 가지 NOT_VERIFIED·ReplicaLag FAIL·전체 HOLD는 유지합니다.
  failed_provision_recovery:
    executable: "labbit-recover-failed-provision"
    lifecycle: "trusted operator one-shot; default dry-run"
    evidence_executable: "labbit-recovery-evidence"
    authority: >-
      SaaS 사용자 역할이나 GitHub 권한이 아니라 DB 접근과 기존 host key로 고정된 Connector 관리 SSH를 소유한 infrastructure operator만 실행합니다.
      --project로 운영자가 확인한 Project binding을 지정합니다(DB ProviderConnection은 Project ID를 저장하지 않습니다).
      evidence executable은 기존 Connector와 동일한 보호된 Provider 환경을 받고 CIDR 원장 소유자로 실행합니다.
      SSH wrapper·known_hosts·private key·환경 파일은 trusted operator만 변경할 수 있어야 합니다. 임의 JSON receipt 입력은 지원하지 않습니다.
      복구 DB 연결은 CA/hostname 검증이 필수이며 optional --database-tunnel은 literal loopback IP의 transport만 바꾸고 원래 TLS identity를 유지합니다.
    semantics: >-
      기존 자동 Reconcile의 후보 비채택 정책과 별도입니다. generation 1의 단일 VM KT D1 PROVISION에서 결과를 전부 유실한 RECONCILING/HOLD만 지원합니다.
      새로운 nonce를 보내 고정 SSH host key로 인증한 원격 executable에서 현재 pool/Project/ProviderConnection binding, assignment, 원래 intent와 immutable FAILED completion을 대조합니다.
      완전한 5개 exact-ID의 실제 존재·server metadata·root attachment·비공유 Tier CIDR·SSH policy를 조회합니다. 이름/Tag/최신 조회만으로 소유권을 추론하지 않습니다.
      dry-run plan은 DB immutable Snapshot hash·작업/Instance/generation/Connector/Connection·원장/receipt hash·host key·자원·운영자 label을 포함합니다.
      --apply-plan의 SHA256과 새로 인증·조회한 계획이 같고 current HOLD/lease/제품 소유관계가 다시 일치할 때 전용 transaction writer가 자원과 FAILED/ERROR·집계·감사 metadata를 원자적으로 복원합니다.
      active lease·자원 충돌·불완전/부재/UNKNOWN/SUCCEEDED receipt·다른 generation/Reset은 거절하며 HOLD를 유지합니다. RUNNING/PENDING 재실행·READY 추정·직접 Provider 삭제는 하지 않습니다.
      성공 후 기존 HTTP Cleanup을 별도로 실행합니다. migration 000011은 rollout 전 별도 migration runner로 적용하며 server restart는 필요하지 않습니다.
  frontend:
    type: "static-spa"
    server_process_required: false
    secret_runtime_config_allowed: false

saas:
  listeners:
    application:
      env: "LABBIT_HTTP_ADDR"
      default: ":8080"
      purpose:
        - "HTTP API"
        - "Browser WebSocket Upgrade"
        - "Connector WebSocket Upgrade"
        - "preview role이 co-located인 경우 Preview HTTP/WSS"
      public_exposure: >-
        container listener 자체는 public contract가 아닙니다. 플랫폼은 HTTPS/WSS 443
        public entry 경계를 통해 승인된 route만 노출합니다.
    admin:
      env: "LABBIT_ADMIN_ADDR"
      default: ":9090"
      public_exposure: false
      endpoints:
        liveness:
          path: "/livez"
          success_status: 200
          semantics: >-
            process 자체의 liveness만 나타냅니다. PostgreSQL, Connector 또는 OpenStack의
            일시적 장애 때문에 liveness를 실패시키지 않습니다.
        readiness:
          path: "/readyz"
          success_status: 200
          failure_status: 503
          semantics: >-
            process startup이 완료되고 활성화된 모든 role이 새 작업을 안전하게 받을 수 있어야 합니다.
            API/worker role은 사용 가능한 PostgreSQL 연결과 호환되는 schema를 요구합니다.
            모든 고객 Connector 또는 OpenStack이 online이어야 readiness가 성공하는 구조로 만들지 않습니다.
        metrics:
          path: "/metrics"
          format: "Prometheus text exposition"
          semantics: >-
            운영 metric만 노출합니다. high-cardinality resource/request/session 식별자는
            metric label로 사용할 수 없습니다.

  maintenance:
    admission: >-
      LABBIT_MAINTENANCE_FILE이 미설정이면 기존 동작입니다. 설정하면 매 HTTP admission마다 파일을 읽으며 공백을 제거한 내용이 open일 때만 허용합니다. closed, 누락, 읽기 오류, 16 byte 초과 입력은 차단합니다. 인증·권한·committed replay 확인 뒤 새 Provision/Reset/Cleanup을 저장 전에 503(code maintenance)으로 거절합니다. 기본 MAINTENANCE 정책에서 Worker도 새 claim을 멈추며 이미 허용한 claim/execution은 완료까지 추적합니다. 명시적인 APPROVED_CONTROL 정책에서는 HTTP 차단과 별도로 영속 Worker 제어를 적용합니다.
      인증·현재 권한·committed idempotency replay 확인 뒤 신규 Provision/Reset/Cleanup 등록 전에 503(code maintenance)으로 거절합니다. Replay 200과 기존 401/403/409·조회/session 동작은 유지합니다. Retry-After와 사용자 header/body 제어 우회는 제공하지 않습니다. Public/peer/internal service가 같은 경계를 사용합니다.
    barrier: >-
      각 process는 파일 관측과 admission 등록을 같은 lock으로 직렬화합니다. 모든 serving process에서 labbit_maintenance_closed=1과 labbit_maintenance_active{kind=http|worker}=0을 확인해야 합니다. 이미 전송된 외부 작업과 결과 불명 작업은 별도 drain 및 reconciliation이 필요합니다. 이 경계는 DB 및 모든 writer fencing을 보장하지 않습니다.
      PR194의 process-local lock은 파일 관측과 admission 등록을 직렬화합니다. 일반 Worker는 새 RunOne을 중지하고 이미 admission한 실행은 종료까지 kind=worker로 추적합니다. 이 drain 동안 기존 WorkerControl ACTIVE라면 기수락 작업이 dispatch될 수 있습니다. 별도의 WorkerControl Pause는 이후 claim/prepare/dispatch/requeue를 차단하여 미완료 claim/UNKNOWN을 보존합니다. 모든 process의 labbit_maintenance_closed=1 및 active{kind=http|worker|reconciliation}=0, authoritative Report·기수락/UNKNOWN 목록을 함께 확인해야 하며 집계 metric만으로 전역 정지를 선언하지 않습니다.
    platform: >-
      모든 serving Pod/role과 restart에 동일한 read-only 파일 설정을 강제해야 합니다. 파일 변경 권한은 trusted infrastructure operator에게만 주며 application ServiceAccount는 쓰기 권한이 없어야 합니다. Kubernetes에서는 GitOps desired state의 ConfigMap directory mount(subPath 금지)와 기존 Kubernetes auth/RBAC를 사용합니다. 전파는 원자적이지 않으므로 모든 Pod 관측 전에는 진입 완료가 아닙니다. 진입/해제 확인 중 rollout/HPA 변경을 동결하고 새 Pod가 생기면 전체 barrier 확인을 다시 시작합니다. readiness는 Control 유지를 위해 maintenance로 내리지 않습니다. 불명 상태에서는 닫힌 상태를 유지합니다. 신규 HTTP 접수 재개와 기본 MAINTENANCE Worker 재개는 DB 단일 writer와 fencing, 기수락 작업 정산 및 승인된 운영 재검증 후 trusted operator가 명시적으로 open을 설정한 경우에만 허용합니다. APPROVED_CONTROL Worker는 closed를 유지한 채 새 승인·authoritative ACTIVE 상태·새 immutable binding으로 정산된 기존 backlog를 처리할 수 있습니다. 자동 TTL이나 재개는 없습니다.
      모든 serving Pod/role/restart에 operator 소유 read-only ConfigMap directory mount(subPath 금지)를 적용해야 합니다. 전파는 원자적이지 않으므로 전체 Pod 관측 전 GO 금지이며 rollout/HPA 변경 시 coverage를 재확인합니다. Application은 mode 파일을 쓰거나 Pod를 rollout하지 않습니다. readiness를 maintenance 때문에 내리지 않습니다. File open과 영속 제어 ACTIVE는 독립 조건입니다. 파일 개방만으로 이전 revision/epoch나 pause latch가 유효해지지 않습니다. 실제 배포·모드 변경·단일 Writer/Fencing 검증과 운영 승인 Adapter는 이번 오프라인 통합 밖입니다.
    reconciliation: >-
      RECONCILE_ONLY 조립에서 maintenance의 일괄 claim 차단은 적용하지 않고 전체 RunOne의 query/결과 기록을 별도 kind=reconciliation으로 관측합니다. 이는 허용 스위치가 아닙니다. 이 경로는 persistent WorkerControl과 관측 callback을 모두 요구하고 매 typed claim/prepare/Router send에서 exact authoritative binding을 검사합니다. Mutation queue·prepare·dispatch는 계속 차단합니다. Reconciliation 결과/lease 기록도 DB 쓰기이므로 별도 승인된 Writer·Fencing·작업 정산 근거가 필요합니다.

  config:
    LABBIT_RUNTIME_ROLES:
      required: true
      secret: false
      format: "comma-separated"
      allowed:
        - api
        - worker
        - realtime
        - preview
    LABBIT_ENVIRONMENT:
      required: true
      secret: false
      examples:
        - development
        - staging
        - production
    LABBIT_HTTP_ADDR:
      required: false
      secret: false
      default: ":8080"
    LABBIT_PUBLIC_ORIGIN:
      required_when: >-
        api role enables Browser HTTP/Auth handlers,
        or realtime role enables Browser Terminal/Live WSS
      secret: false
      format: "absolute origin URL (scheme + host + optional port, no path/query/fragment)"
      examples:
        - "http://localhost:5173"
        - "https://labbit.example.com"
      note: >-
        Browser unsafe-method CSRF/Origin 검증과 Browser WebSocket Upgrade Origin 검증의 trusted target origin입니다.
        request Host/X-Forwarded-Host를 신뢰해 동적으로 결정하지 않습니다.
        개발자 PC에서는 Vite Browser origin, 공유 Local/AWS에서는 실제 public HTTPS app origin을 주입합니다.
        realtime role 때문에 이 값이 필요해지는 것이며 PostgreSQL DSN 요구를 추가하지 않습니다.
    LABBIT_MAINTENANCE_FILE:
      required: false
      secret: false
      note: >-
        PR194의 trusted operator 소유 read-only mode 파일입니다. 미설정이면 기존 접수 동작을 유지합니다.
        설정하면 매 신규 접수/기본 MAINTENANCE Worker RunOne 진입마다 읽고 trim한 내용이 open일 때만 허용합니다.
        closed, 누락, 읽기 오류, 16 byte 초과 및 알 수 없는 값은 차단합니다.
        기존 미배포 후보 설정 LABBIT_MUTATION_ADMISSION_MODE는 제거했으며 비어 있지 않으면 startup을 거절합니다.
    LABBIT_WORKER_CONTROL_MODE:
      required: false
      secret: false
      default: "ACTIVE"
      allowed: ["ACTIVE", "PAUSE_NEW", "RECONCILE_ONLY"]
      applies_when: "api 또는 worker role이 enabled된 process"
      note: >-
        시작 모드를 같은 process의 Worker와 Connector Router에 공유합니다. 미설정·빈 값은 기존 ACTIVE이며
        다른 값은 startup 오류입니다. PAUSE_NEW는 신규 mutation 및 reconciliation claim/전송을 차단합니다.
        RECONCILE_ONLY는 앱 조립 시 postgres 영속 제어가 필수이며 mutation claim을 건너뛰고 기존 조회 전용 Reconciliation만 허용합니다.
        Reconciliation lease·결과 기록은 DB 쓰기이므로 승인된 Writer와 계보·Single Writer 선행 검증 없이
        복제본/Writer=NONE 단계에서 사용하면 안 됩니다. 이 설정이 해당 승인이나 Single Writer를 검증하지 않습니다.
        Worker 없이 api만 실행돼도 Router의 직접 Operation/Reconcile 전송에 동일 모드를 적용합니다.
        실행 중 제한은 아래 local_pause 경계를 따릅니다. /readyz는 기존 의존성 기준이며 작업 허용/DR GO를 뜻하지 않습니다.
        기본 ACTIVE 또는 설정 유실 후 재시작은 fail-closed DR 준비가 아닙니다. 플랫폼이 PAUSE_NEW를 명시·보존해야 합니다.
    LABBIT_WORKER_ADMISSION_POLICY:
      required: false
      secret: false
      default: "MAINTENANCE"
      allowed: ["MAINTENANCE", "APPROVED_CONTROL"]
      note: >-
        MAINTENANCE는 PR194의 기본 동작으로 closed 파일에서 신규 HTTP 접수와 Worker claim을 함께 차단합니다.
        APPROVED_CONTROL은 LABBIT_WORKER_CONTROL_BACKEND=postgres 및 구성된 maintenance 파일을 요구하는 명시적 후보 opt-in입니다.
        HTTP 신규 접수는 계속 closed에서 차단하고, Worker는 파일이 정확히 open/closed인지만 확인한 뒤
        매 claim/prepare/dispatch의 authoritative Store·immutable binding으로 허용 여부를 판단합니다.
        일반 mutation Worker 진입에서는 파일 누락/오류/알 수 없는 값을 계속 차단하며 local 또는 불완전한 durable 설정으로 fallback하지 않습니다.
        RECONCILE_ONLY의 typed query 경로는 maintenance.reconciliation에 정의한 별도 관측·권한 경계를 따릅니다.
        이 모드에서는 maintenance closed만으로 Worker 중지를 기대하면 안 되며 별도 durable Pause 및 전체 boundary 정산이 필수입니다.
        새 승인 재개·WorkReconciled/Single Writer/Pod coverage·새 binding 배포 전에는 활성화하지 않습니다.
    LABBIT_WORKER_CONTROL_BACKEND:
      required: false
      secret: false
      default: "local"
      allowed: ["local", "postgres"]
      applies_when: "api 또는 worker role이 enabled된 process"
      note: >-
        local은 기존 프로세스 범위 제어입니다. postgres는 아래 durable_boundaries 계약의 명시적 opt-in이며
        기존 LABBIT_DATABASE_DSN pool을 단일 authoritative 제어 Writer로 사용하는 후보 adapter입니다.
        누락 row·권한/조회 실패·binding 불일치에서 local/ACTIVE로 fallback하지 않습니다.
        업무 DB 복제본 또는 리전별 비동기 복제 DB를 독립 control Writer로 사용하면 안 됩니다.
        실제 DR 제어 저장소 위치·분리 권한·장애 중 접근 경로는 미인수이며 이 옵션으로 자동 확정하지 않습니다.
    LABBIT_WORKER_CONTROL_ID:
      required_when: "LABBIT_WORKER_CONTROL_BACKEND=postgres"
      secret: false
      note: "승인 계획에 고정한 control scope ID. 영숫자 시작, 영숫자/._:-로만 최대128자. 요청에서 추론하지 않습니다."
    LABBIT_WORKER_CONTROL_REGION:
      required_when: "LABBIT_WORKER_CONTROL_BACKEND=postgres"
      secret: false
      note: "제어 대상 리전 label, ID와 같은 문자열 규칙. 저장소 접속 리전이나 STS 신원을 입증하지 않습니다."
    LABBIT_WORKER_CONTROL_CLUSTER:
      required_when: "LABBIT_WORKER_CONTROL_BACKEND=postgres"
      secret: false
      note: "제어 대상 클러스터 label, ID와 같은 문자열 규칙. 실제 배포 소유권의 증거가 아닙니다."
    LABBIT_WORKER_CONTROL_REVISION:
      required_when: "LABBIT_WORKER_CONTROL_BACKEND=postgres"
      secret: false
      note: "명시적으로 고정한 양의 int64 revision. 최신 값을 자동 채택하지 않습니다."
    LABBIT_WORKER_CONTROL_EPOCH:
      required_when: "LABBIT_WORKER_CONTROL_BACKEND=postgres"
      secret: false
      note: >-
        명시적으로 고정한 양의 int64 epoch. postgres 설정은 LABBIT_POD_ID 또는 POD_NAME의 유효 label과 DB DSN도 필요하며
        process마다 별도 boot UUID를 생성합니다. local과 persistent 필드가 혼합된 부분 설정은 startup 오류입니다.
    LABBIT_ADMIN_ADDR:
      required: false
      secret: false
      default: ":9090"
    LABBIT_LOG_LEVEL:
      required: false
      secret: false
      default: "info"
    LABBIT_DATABASE_DSN:
      required: false
      secret: true
      note: "Local development용 escape hatch입니다. production에서는 사용하지 않습니다. 값을 log에 기록하지 않습니다."
    LABBIT_DATABASE_DSN_FILE:
      required_in_production_when: "api 또는 worker role이 enabled된 process, labbit-migrate"
      secret: false
      note: >-
        Production에서 우선 사용하는 입력입니다. 참조된 파일에는 플랫폼의 Secret injection
        mechanism이 제공한 PostgreSQL DSN이 들어 있습니다. 두 DSN 입력이 모두 설정되면
        file form을 우선합니다. PostgreSQL을 사용하지 않는 realtime/preview 전용 process에는 요구하지 않습니다.
    LABBIT_PREVIEW_ALLOWED_PORTS:
      required_when: "preview role이 enabled된 process"
      secret: false
      format: "comma-separated decimal TCP port list (예: 3000,8080)"
      note: >-
        PreviewSession이 승인할 수 있는 Workspace VM application port의 **Backend 명시적 허용 목록**입니다. 이 목록이 trust root이며
        숫자 범위로 자동 승인하지 않고(범위 표기는 형식 오류) 코드에 기본 port를 두지 않습니다. 3000 같은 값도 기본값이 아닙니다.
        설정하지 않았거나 비어 있으면 startup에 실패합니다(fail closed). 중복은 정규화하고 1~65535가 아닌 값·정수가 아닌 값은 형식 오류입니다.
        SSH 관리 port(22)는 목록에 있어도 Preview 대상으로 항상 거절합니다. 이 값은 process 전체의 global 정책이며 LabSpec별 port 정책이
        아닙니다(LabSpec/CreationSnapshot에는 Preview port 목록이 없음). 승인은 PreviewSession마다 정확한 port 하나에 bind됩니다.
    LABBIT_PREVIEW_SESSION_TTL:
      required_when: "preview role이 enabled된 process"
      secret: false
      format: "Go duration (0보다 큰 값)"
      note: >-
        PreviewSession의 절대 TTL(생성이 끝난 시점부터)입니다. 명시해야 하며 기본값이 없습니다. 0, 음수, 해석할 수 없는 값은 startup에 실패합니다.
        이 계약은 수치를 고정하지 않습니다.
    LABBIT_PREVIEW_ORIGIN_TEMPLATE:
      required_when: "preview role이 enabled된 process"
      secret: false
      format: "absolute origin URL template (scheme + host + optional port, no path/query/fragment), host의 첫 label이 {sessionId}"
      examples:
        - "https://{sessionId}.preview.example.com"
        - "http://{sessionId}.localhost:8080"
      note: >-
        사용자 코드가 실행되는 Preview Origin입니다. `{sessionId}` placeholder는 host의 첫 label로 정확히 한 번 있어야 하며 PreviewSession ID로 치환됩니다.
        SaaS 본 서비스 Origin(LABBIT_PUBLIC_ORIGIN)과 분리된 별도 Origin(separate-origin)이어야 하되, iframe 임베딩과 인증 격리를 위해 동일한 scheme 및 registrable domain(eTLD+1)을 공유하는 same-site여야 합니다 (예: SaaS가 https://labbit.example.com이면 Preview template은 https://{sessionId}.preview.example.com, scheme 또는 site 불일치 시 startup fail-closed). 본 서비스 host가 이 template에 일치해서도 안 됩니다. production에서는 https여야 합니다.
        Browser에 VM IP/port, Provider Server ID, Connector ID를 노출하지 않습니다. 이 예시 hostname은 실제 값이 아니며 wildcard DNS, 인증서,
        Ingress/Gateway route, production hostname은 Platform/IaC가 소유합니다. request Host는 이 template에 일치할 때만 Preview Gateway로 갑니다.
    LABBIT_SHUTDOWN_GRACE:
      required_in_production: true
      secret: false
      format: "Go duration"
      note: >-
        플랫폼 검증을 거친 graceful shutdown budget입니다. v0.1에서는 normative 값을
        고정하지 않으며 integration test 이후 terminationGracePeriodSeconds와 connection
        draining 설정을 함께 조정해야 합니다.
    OTEL_SERVICE_NAME:
      required: false
      secret: false
      default: "labbit-server"
      note: "SaaS Trace resource의 service.name입니다. component와 environment도 식별 가능해야 합니다."
    OTEL_TRACES_EXPORTER:
      required: false
      secret: false
      default: "none"
      allowed:
        - none
        - otlp
      note: >-
        none은 로컬 개발/명시적 export 비활성화용 Labbit 기본값이며 Context 전달을 끄지 않습니다.
        중앙 Trace 인수 검증 환경은 플랫폼이 otlp로 명시적으로 활성화합니다.
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:
      required_when: "OTEL_TRACES_EXPORTER=otlp"
      secret: false
      format: "URL"
      note: >-
        SaaS 전용 Collector 수신 주소입니다. 자격증명은 URL에 넣지 않습니다.
        HTTP/protobuf를 선택하면 /v1/traces를 포함한 최종 Trace URL을 주입합니다.
        실제 주소·TLS·필요한 인증 주입은 플랫폼이 관리하며 Connector에는 주입하지 않습니다.
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:
      required_when: "OTEL_TRACES_EXPORTER=otlp"
      secret: false
      allowed:
        - grpc
        - http/protobuf
      note: >-
        첫 통합 전에 개발·운영이 SDK exporter와 Collector receiver가 같은 protocol을
        사용하도록 선택·검증합니다. 이 계약은 모든 SDK 환경변수가 자동 적용된다고 보장하지 않습니다.
    OTEL_EXPORTER_OTLP_TRACES_HEADERS:
      required: false
      secret: true
      format: "OpenTelemetry OTLP header list"
      note: >-
        Collector가 bearer/API-key 등 application-layer header 인증을 요구할 때 플랫폼이
        Secret으로 주입합니다. 값 원문은 로그·진단·Confluence/Git에 기록하지 않습니다.
    OTEL_EXPORTER_OTLP_TRACES_CERTIFICATE:
      required: false
      secret: false
      format: "PEM CA certificate file path"
      note: >-
        Collector TLS가 시스템 기본 trust store에 없는 CA를 사용할 때 플랫폼이 PEM CA 파일을
        mount하고 이 경로를 주입합니다. 인증서 본문을 환경변수 값으로 넣지 않습니다.
    OTEL_EXPORTER_OTLP_TRACES_CLIENT_CERTIFICATE:
      required: false
      secret: false
      format: "PEM client certificate file path"
      note: >-
        Collector가 mTLS client certificate를 요구할 때 플랫폼이 certificate 파일을 mount하고
        이 경로를 주입합니다.
    OTEL_EXPORTER_OTLP_TRACES_CLIENT_KEY:
      required: false
      secret: false
      format: "PEM client private key file path"
      note: >-
        Collector가 mTLS를 요구할 때 플랫폼이 Secret으로 private key 파일을 mount하고
        이 경로를 주입합니다. 파일 내용은 로그·진단에 기록하지 않습니다.

  database:
    required_by_roles:
      - api
      - worker
    dsn_requirement: >-
      api/worker role이 enabled된 process와 labbit-migrate는 LABBIT_DATABASE_DSN_FILE 또는
      LABBIT_DATABASE_DSN이 없으면 startup에 실패합니다. production에서는 LABBIT_DATABASE_DSN_FILE만 사용합니다.
      PostgreSQL을 사용하지 않는 realtime/preview 전용 process는 DSN 입력을 요구하지 않습니다.
    not_required_by_roles:
      - realtime
      - preview
    startup_migration: false
    migration_source: "db/migrations/*.sql"
    migration_execution: >-
      application rollout 전에 별도의 platform/CI migration step에서 labbit-migrate up을 실행합니다.
      Application replica들이 startup 시 서로 경쟁하며 AutoMigration을 실행해서는 안 됩니다.
    compatibility: >-
      database schema가 해당 application version이 지원하는 compatibility 범위를 벗어나면
      process는 startup/readiness에 실패해야 합니다.
    schema_compatibility:
      compatible_when: >-
        application build에 포함된 모든 migration이 같은 checksum으로 적용되어 있으면 호환입니다.
        build가 모르는 더 높은 version의 적용 기록은 그 자체로 비호환으로 보지 않습니다.
      rolling_invariant: >-
        정상 rolling deployment에서 application rollout보다 먼저 실행하는 migration은 현재 배포 중인
        application version과 backward-compatible해야 합니다. 순서는 old app → backward-compatible
        migration → old/new app 일시 공존 → new app rollout입니다.
      excluded_from_rolling:
        - "old application이 사용하는 column/table 삭제"
        - "의미가 호환되지 않는 constraint 변경"
        - "old application query를 깨뜨리는 schema 변경"
      excluded_change_process: >-
        backward-incompatible/destructive migration은 normal rolling path로 배포하지 않습니다. D-22에 따라
        maintenance window, 명시적인 application/schema 전환 순서, restore/recovery 계획,
        실제 호환성 검증을 거칩니다.
      note: >-
        migration별 호환성 metadata는 두지 않습니다. 이 invariant는 review와 integration validation으로 확인합니다.

  worker:
    local_pause:
      scope: "같은 process의 Executor/Router 공유 제어, 전역·영속 barrier 아님"
      semantics: >-
        Executor.Pause(ctx)는 먼저 PAUSE_NEW를 latch한 뒤 이미 진입한 짧은 claim/prepare/send 및 미전송 재등록
        경계가 끝날 때까지 기다립니다. claim commit 응답 지연과 전송 중인 경계는 drain 전까지 남을 수 있습니다.
        새 경계는 즉시 거절합니다. prepare/lifecycle 처리 후 전송 직전에도 재검사하고 직접 Router 호출도 차단합니다.
        Pause 이후 미전송 작업을 자동 PENDING으로 되돌리거나 새 mutation을 재전송하지 않습니다.
        Pause 전에 진입한 미전송 재등록 transaction은 완료될 수 있으므로 Pause 성공 전에는 정지를 주장하지 않습니다.
        timeout/cancel은 이미 latch한 pause를 해제하지 않으며 quiescence를 입증하지 않습니다.
        이미 전송된 Provider 작업을 취소/삭제하지 않고 pending correlation·lease 갱신·ACK/RESULT 수집을 유지합니다.
        Quiesced는 로컬 짧은 경계 drain만 의미하며 inflight Provider 0건·DB 쓰기 중지·전체 Fencing을 뜻하지 않습니다.
      activation_limit: >-
        실행 중 ACTIVE/RECONCILE_ONLY로 되돌리는 setter나 공개 운영 endpoint는 제공하지 않습니다.
        다른 시작 모드로 재배포/재시작하려면 별도 승인과 기존 작업 정산·Writer 검증이 필요합니다.
        local backend는 durable 상태/다중 process 검증을 제공하지 않습니다. postgres opt-in의 추가 경계는 durable_boundaries를 따릅니다.
        영속 backend의 승인 재개 후보는 approved_resume를 따릅니다. 실제 인증/검증 Adapter와 배포 연동은 후속 범위입니다.
        이 로컬 기능으로 기존 DR HOLD·NOT_VERIFIED·ReplicaLag FAIL을 해소하지 않습니다.
    durable_boundaries:
      status: "미배포 후보 구현; Fake/driver Mock 검증과 실제 PostgreSQL·다중 Pod 인수 구분"
      migration: "db/migrations/000012_worker_control.sql"
      binding:
        fields: [control_id, region, cluster, revision, epoch, mode, pod_id, boot_id]
        fixed_for_process: true
        newer_revision_is_not_approval: true
      ticket:
        fields: [id, binding, kind, phase]
        kinds: [MUTATION, RECONCILIATION]
        phases: [MUTATION_CLAIM, MUTATION_PREPARE, MUTATION_DISPATCH, MUTATION_REQUEUE, RECONCILIATION_CLAIM, RECONCILIATION_PREPARE, RECONCILIATION_DISPATCH]
        lifecycle: "Enter COMMIT -> 경계 처리 -> Leave COMMIT; 응답 유실은 HOLD이며 작업을 자동 재실행하지 않음"
      semantics: >-
        각 claim/prepare/dispatch/미전송 재등록은 단일 authoritative state row를 잠그고 전체 binding·mode를 확인한 뒤
        open intent를 commit하고 실행합니다. Pause는 같은 row를 CAS하여 revision을 증가시키고 PAUSE_NEW로 제한합니다.
        영속 CAS 실패/timeout을 전체 Pod 중단 성공으로 처리하지 않습니다. 이미 Enter한 짧은 경계는 완료될 수 있고
        새 경계는 거부되며 전체 revision/boot의 open intent가 0이 될 때까지 HOLD입니다. 외부 I/O 중 DB transaction을 유지하지 않습니다.
        Enter 실패/응답 유실은 새 ticket으로 재시도하거나 자동 Leave하지 않고 작업을 시작하지 않으며 남을 수 있는 intent를 보존합니다.
        Leave는 진입 당시의 전체 ticket만 멱등하게 닫으며 현재 revision이 달라져도 종료할 수 있습니다.
        Leave 실패는 로컬의 미검증 상태를 latch합니다. intent의 자동 TTL/Pod 소멸 GC는 없고 재시작/epoch 변경으로 삭제하지 않습니다.
        상태는 매번 새로운 authoritative 작업으로 확인하며 cache PASS나 Pod 생존으로 대체하지 않습니다.
      provisioning: >-
        초기화는 create-only PAUSE_NEW/revision1/epoch1이며 기존 scope/target/epoch를 덮어쓰지 않습니다.
        승인된 PAUSE_NEW -> ACTIVE/RECONCILE_ONLY 전환과 revision/epoch 증가는 approved_resume의 내부 후보 구현을 따릅니다.
        실제 승인/Writer 검증 Adapter·운영 HTTP endpoint·startup 자동 재개는 제공하지 않습니다.
      report: >-
        Report는 state와 전체 open boundary 및 미해결 resume INTENT 수를 단일 snapshot에서 조회합니다.
        PendingResumes > 0이면 Drained/Pause는 HOLD이며 기존 activation 결과를 소급 성공으로 치환하지 않습니다. Drained는 같은 control Writer에 참여한 구현의
        짧은 경계에 한정되며 전체 Pod coverage·이미 전송된 Provider 작업0건·DB 쓰기 중지·Single Writer·DR GO가 아닙니다.
        구 image/local 설정, 다른 scope, 다른 DB/비동기 replica, 직접 Provider writer는 이 제어 범위 밖입니다.
        API admission은 maintenance 파일 경계이며 이 pause만으로 HTTP 신규 등록을 막지 않습니다.
      safety: >-
        이 migration을 포함한 build는 기존 schema readiness에도 영향을 주므로 향후 배포 전 별도 migration 적용과 호환성 확인이 필요합니다.
        startup은 migration/bootstrap/권한 변경을 실행하지 않습니다. AWS/공유 DB/서울 서비스 변경 없이 기존 FAIL/4NOT_VERIFIED/HOLD를 유지합니다.
    approved_resume:
      status: "내부 opt-in 후보; 폐기용 PostgreSQL 16 검증, 실제 승인·Fencing·공유 DB·다중 Kubernetes Pod 미검증"
      migration: "db/migrations/000014_worker_control_resume_applied_time.sql"
      request_fields: [CommandID, Scope, ExpectedRevision, ExpectedEpoch, Desired, TrialID, RunID, Phase, Principal, ApprovalRef, PlanSHA256, PreconditionsSHA256, RequestedAt, ValidUntil]
      desired: [ACTIVE, RECONCILE_ONLY]
      transitions: >-
        현재 PAUSE_NEW 및 expected revision/epoch/대상 일치, 전체 open boundary 0, pending resume INTENT 0에서만 새 명령을 준비합니다.
        trusted Authorizer는 실제 인증·권한·승인 ID의 정확 요청 SHA binding을 확인해야 하며 reference/approved=true만 신뢰하지 않습니다.
        trusted Rechecker는 같은 RUN/Plan/Target/단계/epoch의 AdmissionBlocked, SingleWriter, Fencing, WorkInventory, PodCoverage를
        PASS로 확인해야 합니다. ACTIVE에는 WorkReconciled PASS도 필요하며 RECONCILE_ONLY는 exact-ID 정산만 허용합니다.
        이 PASS는 trusted Adapter의 입력 계약이고 이 코드 자체가 실제 Writer/Fencing을 검사했다는 증거가 아닙니다.
      journal: >-
        물리 schema는 000013의 journal과 000014의 APPLIED 시각 제약을 함께 따릅니다.
        새 명령은 별도 transaction으로 INTENT를 commit한 뒤 그 creator만 Apply를 한 번 시도합니다.
        Apply는 같은 state row lock에서 target/revision/epoch/PAUSE_NEW·open boundary·승인/재검증 시각을 다시 확인합니다.
        state의 revision+1/epoch+1 및 APPLIED receipt를 같은 transaction으로 commit합니다. 외부 I/O 중 transaction을 유지하지 않습니다.
        동일 CommandID의 다른 payload는 거절하며, 동일 payload의 기존 APPLIED는 역사적 결과 재생만 합니다.
        기존 INTENT는 UNKNOWN/HOLD이며 재시작·재호출이 자동 Apply/삭제/재전송하지 않습니다. 다른 command도 이를 우회하지 못합니다.
        Approval ID는 한 command에서만 소비합니다. 과거 결과나 Failover 승인을 새 Failback·단계 승인으로 재사용하지 않습니다.
      time_policy: >-
        모든 입력 시각은 UTC microsecond 및 연도 1~9999입니다. now >= RequestedAt/NotBefore, now < ValidUntil/ExpiresAt,
        RequestedAt <= ObservedAt <= now < checks.ValidUntil을 요구하며 정확 만료 시점은 거절합니다.
        기본 승인 TTL/시계 허용 오차를 임의로 설정하지 않습니다. 실제 정책과 시계 신뢰는 운영 연계 전 확정해야 합니다.
        승인·관측 유효기간은 제어 명령의 유효성 검사이며 작업 실행 lease가 아닙니다.
      consumers: >-
        기존 Control은 immutable binding과 pause/unverified latch를 유지하여 자동으로 열리지 않습니다.
        재개 receipt 자체는 dispatch 권한이 아닙니다. 별도 승인 배포에서 새 revision/epoch/mode로 구성된 process만
        매 claim/prepare/dispatch의 authoritative Enter를 통과할 수 있습니다. 배포·mode file 변경은 수행하지 않습니다.
      boundaries: >-
        Resumer/ResumeStore는 trusted 내부 포트이며 public API나 웹 승인 UI가 아닙니다.
        별도 opt-in labbit-dr-control 후보의 서명/STS adapter는 artifacts.dr_worker_control 및 runtime/dr-control.md를 따릅니다.
        실제 안전 상태 Collector·전역 소유권·변경 통제·운영 배포는 미인수이며 재개 자동 loop는 없습니다.
        api admission OPEN이나 Slack, Step Functions 실연계, Single Writer/전체 Pod coverage/Provider 실행0은 증명하지 않습니다.
        App PR194의 maintenance/service/Worker admission을 로컬 통합했으며 NewMaintenanceResumer는
        configured exact closed 및 http/worker/reconciliation 전체 local count0을 진입/INTENT/Apply 직전에 추가 확인합니다.
        외부 AdmissionBlocked/PodCoverage PASS를 생성하거나 덮어쓰지 않습니다. 알 수 없는 파일은 차단되지만 verified closed가 아닙니다.
        로컬 파일 snapshot과 DB commit은 원자적이지 않으므로 외부 변경 통제·전체 Pod 관측은 여전히 필수입니다.
        APPLIED readback은 역사적 receipt일 뿐이며 자동 파일 개방·배포·startup 재개는 없습니다.
        기존 ReplicaLag FAIL·4NOT_VERIFIED·execution_gate=HOLD·recovery_authorized=false·cloud_verified=false를 유지합니다.
    v0_1_topology:
      required_co_located_roles:
        - api
      supported_operations:
        - PROVISION
        - RESET
        - CLEANUP
      authority_provider: >-
        PROVISION/RESET/CLEANUP은 같은 process의 api role이 소유한 Connector Control Registry/Router로 실행합니다.
        worker role은 호환 PostgreSQL schema와 로컬 Worker 제어가 허용할 때 PENDING Item을 mutation 실행용으로 claim합니다.
        만료된 RUNNING 및 RECONCILING Item은 새 lease로 조회 전용 Reconciliation을 수행하며 mutation을 다시 실행하지 않습니다.
        저장된 exact ID·generation·제품 소유관계를 기존 RECONCILE_REQUEST/RESULT로 대조합니다.
        불확실성·발견 후보는 RECONCILING/HOLD를 유지하고 자동 채택·삭제하지 않습니다.
        CLEANUP의 전체 추적 자원 부재가 확인된 경우만 완료를 반영하며 PROVISION/RESET의 관측만으로 생성 완료나 READY를 추정하지 않습니다.
      worker_without_api: >-
        api 없이 worker만 enabled되면 작업을 claim하지 않고 /readyz가 실패합니다.
        별도 worker process용 분산 Router나 internal routing RPC는 제공하지 않습니다.
      api_without_worker: >-
        api만 enabled되면 Operation을 등록하고 조회하지만 Item을 실행하지 않습니다.
      note: >-
        Connector는 실행하는 process의 Control Router에 연결되어 있어야 합니다.
        multi-replica Connector ownership routing은 지원한다고 주장하지 않습니다.

  realtime:
    endpoints:
      browser_terminal:
        path: "/realtime/v1/terminal"
        subprotocol: "labbit.terminal.v1"
        contract: "contracts/realtime/README.md"
      browser_live:
        path: "/realtime/v1/live"
        subprotocol: "labbit.live.v1"
        contract: "contracts/realtime/README.md"
      connector_terminal_data:
        path: "/connector/v1/terminal-data"
        subprotocol: "labbit.connector-terminal.v1"
        contract: "contracts/connector/README.md"
    database_required: false
    note: >-
      realtime role은 PostgreSQL을 application dependency로 요구하지 않으며 DB DSN 입력도 요구하지 않습니다.
      Browser Session, 현재 Class 권한, TerminalSession lifecycle, Connector credential 인증과 Connector Control 경로 같은
      DB-backed authority는 realtime 구현이 직접 조회하지 않고 process에 주입된 좁은 interface로만 사용합니다.
    v0_1_topology:
      required_co_located_roles:
        - api
      authority_provider: >-
        v0.1에서 위 authority는 같은 process에서 api role이 제공합니다(PostgreSQL, Browser 인증, TerminalSession 권한/lifecycle,
        Connector Control Registry/Router). 따라서 Terminal 기능이 동작하려면 realtime role과 api role이 같은 process에서 함께
        enabled되어야 합니다(예: LABBIT_RUNTIME_ROLES=api,realtime).
      realtime_without_api: >-
        realtime만 enabled된 process는 authority가 없으므로 Terminal/Live route를 제공하지 않고 /readyz가 실패합니다.
        unauthenticated 또는 부분 동작 route를 열지 않으며 PostgreSQL DSN을 새로 요구하지도 않습니다.
      api_without_realtime: >-
        api만 enabled된 process에는 Terminal Relay가 없으므로 TerminalSession 생성/종료 HTTP가 503(code terminal_unavailable)입니다.
      not_provided:
        - "별도 realtime workload용 internal authorization RPC"
        - "service discovery / Valkey 기반 Terminal owner routing"
        - "multi-replica Terminal owner routing과 session affinity"
      note: >-
        Relay의 TerminalSession 연결 상태와 Browser/Connector attachment는 process 안의 ephemeral 상태입니다.
        process가 비정상 종료되면 이 상태를 복구하지 않습니다. 정상 종료에서는 active TerminalSession을 SERVICE_RESTARTING으로 종료합니다.
        workload 분리와 multi-replica routing은 후속 Platform/Runtime 결정 전까지 지원한다고 주장하지 않습니다.

  file:
    owner_role: "api"
    endpoints:
      browser_http:
        base_path: "/api/v1/lab-instances/{labInstanceId}/files"
        contract: "contracts/http/openapi.yaml"
      connector_file_data:
        path: "/connector/v1/file-data"
        subprotocol: "labbit.connector-file.v1"
        contract: "contracts/connector/README.md#7a-workspace-file-transport"
    database_required: true
    note: >-
      Workspace File Tree/Read/Save는 api role이 소유합니다. realtime role이 필요하지 않으며 Browser HTTP 요청, 권한 판정,
      Connector Control Registry/Router, Connector File Data WSS가 같은 process에 있습니다. 요청마다 pending 상태(요청 ID, 대기 중인
      attach, 진행 중인 Data WSS)를 process 안의 memory에만 두며 PostgreSQL이나 별도 FileSession table에 저장하지 않습니다.
      process가 비정상 종료되면 진행 중인 요청은 실패하며 복구하지 않고, 정상 종료에서는 새 요청을 받지 않고 진행 중인 요청의 Data WSS를
      닫습니다. 파일 본문, 디렉터리 목록, 경로는 persistent Control WSS, PostgreSQL, log, trace, metric label에 남기지 않습니다.
    v0_1_topology:
      not_provided:
        - "multi-replica File owner routing과 session affinity"
        - "service discovery / Valkey 기반 Control connection owner 조회"
      note: >-
        Connector File Data WSS는 해당 요청의 FILE_OPEN을 보낸 process에 도착해야 합니다. 여러 replica에서 이를 보장하는 routing은
        후속 Platform/Runtime 결정 전까지 지원한다고 주장하지 않습니다.
    limits:
      max_file_bytes:
        configurable: true
        note: >-
          Workspace file 크기 한도(HTTP 413)는 process 구성이며 이 contract가 수치를 고정하지 않습니다. 현재 구현은 보수적인 기본값을
          사용하고 테스트에서 주입할 수 있습니다. 이 값은 API compatibility guarantee가 아닙니다.

  preview:
    owner_roles:
      gateway: "preview"
      session_authority: "api"
    endpoints:
      browser_http:
        base_path: "/api/v1/lab-instances/{labInstanceId}/preview-sessions"
        contract: "contracts/http/openapi.yaml"
      preview_origin:
        host_template_env: "LABBIT_PREVIEW_ORIGIN_TEMPLATE"
        reserved_prefix: "/__labbit/"
        bootstrap_path: "/__labbit/bootstrap"
        exchange_path: "/__labbit/exchange"
        contract: "contracts/http/openapi.yaml"
      connector_preview_data:
        path: "/connector/v1/preview-data"
        subprotocol: "labbit.connector-preview.v1"
        contract: "contracts/connector/README.md#7b-preview-transport"
    connector_capability: "preview-v1"
    database_required: false
    note: >-
      PreviewSession 생성·종료와 DB-backed authority(현재 User, LabInstance 소유, 현재 ClassMembership, READY, CreationSnapshot, 현재 generation의
      ProviderResource, Connector)는 `api` role이, Preview Origin의 Browser 인증·Gateway proxy·Connector Preview Data tunnel은 `preview` role이 소유합니다.
      preview role 구현은 PostgreSQL을 application dependency로 요구하지 않으며 DB DSN 입력도 요구하지 않습니다. DB-backed authority는 preview 구현이
      직접 조회하지 않고 process에 주입된 좁은 interface로만 사용합니다. PreviewSession(session/bootstrap/Cookie digest, tunnel)은 process 안의 ephemeral
      상태이며 PostgreSQL이나 별도 PreviewSession table에 저장하지 않고 process 비정상 종료 뒤 복구하지 않습니다. Preview 본문·경로·query·Cookie는
      persistent Control WSS, PostgreSQL, log, trace, metric label에 남기지 않습니다. Preview Origin은 같은 application listener(LABBIT_HTTP_ADDR)에서
      Host로 구분해 제공합니다(SaaS 본 서비스 요청과 섞이지 않음).
    v0_1_topology:
      required_co_located_roles:
        - api
      authority_provider: >-
        v0.1에서 위 authority는 같은 process에서 api role이 제공합니다. 따라서 Preview 기능이 동작하려면 preview role과 api role이 같은 process에서
        함께 enabled되어야 합니다(예: LABBIT_RUNTIME_ROLES=api,preview). 이것은 v0.1의 제약이며 PreviewSession ownership을 api에 두기로 한 영구 결정이 아닙니다.
      preview_without_api: >-
        preview만 enabled된 process는 authority가 없으므로 Preview route를 제공하지 않고 /readyz가 실패합니다. 인증 없는 route를 열지 않으며 PostgreSQL DSN을
        새로 요구하지도 않습니다.
      api_without_preview: >-
        api만 enabled된 process에는 Preview Gateway가 없으므로 PreviewSession 생성/종료 HTTP가 503(code preview_unavailable)입니다.
      not_provided:
        - "Redis/Valkey 등 distributed PreviewSession store"
        - "별도 preview workload용 internal authorization RPC"
        - "multi-replica PreviewSession owner routing과 session affinity"
        - "Preview Origin wildcard DNS/TLS/Ingress 구현 (Platform/IaC 소유)"
      note: >-
        Connector Preview Data WSS와 Browser Preview 요청은 해당 PreviewSession의 PREVIEW_OPEN을 보낸 process에 도착해야 합니다. 여러 replica에서 이를
        보장하는 routing은 후속 Platform/Runtime 결정 전까지 지원한다고 주장하지 않습니다.
    limits:
      session_ttl:
        configurable: true
        env: "LABBIT_PREVIEW_SESSION_TTL"
        note: "수치는 process 구성이며 API compatibility guarantee가 아닙니다."
      allowed_ports:
        configurable: true
        env: "LABBIT_PREVIEW_ALLOWED_PORTS"
        note: "global Backend 정책이며 LabSpec별 정책이 아닙니다."
      bootstrap_credential:
        note: >-
          일회용이며 짧은 시간 안에 교환해야 합니다. 구현의 보수적인 기본 시간이 있고 테스트에서 주입할 수 있으며 이 값은 계약 수치가 아닙니다.
          PreviewSession TTL보다 길지 않습니다.

  shutdown:
    signals:
      - SIGTERM
      - SIGINT
    common_sequence:
      - "readiness를 false로 전환합니다."
      - "종료 중인 role이 새 작업을 받지 않도록 중단합니다."
      - "이미 수락한 작업은 LABBIT_SHUTDOWN_GRACE 안에서 drain하거나 완료합니다."
      - "가장 안전하게 확인된 durable state를 영속한 뒤 종료합니다."
    api:
      rules:
        - "draining이 시작된 뒤에는 새 Provider mutation 등록을 거부합니다."
        - "안전한 경우 bounded in-flight HTTP request가 완료되도록 허용합니다."
    worker:
      rules:
        - "새 PENDING operation_item을 claim하지 않습니다."
        - "Connector/OpenStack 호출 중 PostgreSQL transaction을 열어 둔 채 유지하지 않습니다."
        - "가능하면 종료 전에 확인된 결과를 영속합니다."
        - >-
          shutdown/restart 시 Provider 결과가 불명확하면 retry 전에 실제 OpenStack state를
          Reconcile합니다. lease expiry만으로 blind replay를 허용하지 않습니다.
    realtime:
      rules:
        - "종료 중인 instance에서 새 WebSocket Upgrade를 받지 않습니다."
        - "shutdown budget 안에서 기존 Browser/Connector realtime connection을 drain합니다."
        - >-
          drain 시 active TerminalSession은 SERVICE_RESTARTING 사유로 종료하고 Browser에 TERMINAL_SESSION_ENDED를 전달합니다.
          중앙 connection draining은 Browser 비정상 단절 후 60초 PTY grace와 별개입니다.
    preview:
      rules:
        - "종료 중인 instance에서 새 Preview connection/session을 받지 않습니다."
        - "가능하면 shutdown budget 안에서 active proxy connection을 drain합니다."
        - >-
          drain 시 active PreviewSession은 SERVICE_RESTARTING 사유로 종료하고 Connector에 PREVIEW_CLOSE를 보낸 뒤(Control connection이 열려 있는 동안)
          Preview Data WSS와 진행 중인 proxy 요청을 끝냅니다. Preview 상태는 process 안의 ephemeral 상태이므로 복구하지 않습니다.

  observability:
    logs:
      format: "JSON object per line"
      destinations:
        - stdout
        - stderr
      required_base_fields:
        - timestamp
        - level
        - message
        - service
        - component
        - version
        - environment
      correlation_fields_when_known:
        - trace_id
        - request_id
        - operation_id
        - lab_instance_id
        - connector_id
        - terminal_session_id
        - live_session_id
        - preview_session_id
      operation_fields_when_known:
        - operation_type
        - stage
        - status
        - error_code
        - duration_ms
      forbidden_content:
        - "OpenStack Credential 또는 Keystone Token"
        - "Connector Credential 원문"
        - "Authorization header"
        - "사용자 Password 원문"
        - "Browser/Session/Terminal Token 원문"
        - "Secret을 포함한 Provider raw payload"
        - "Terminal INPUT/OUTPUT"
        - "Live OUTPUT"
        - "workspace file 본문/source code"
        - "workspace file 경로와 디렉터리 목록"
    tracing:
      instrumentation: "OpenTelemetry"
      propagation: "W3C Trace Context"
      exporter: "OTLP"
      trace_backend_is_application_dependency: false
      minimum_boundaries:
        - "HTTP request / Operation 등록"
        - "OperationItem Worker 처리"
        - "Connector Control command 전송 / ACK·PROGRESS·RESULT 수신"
      durable_context:
        source: "operations.traceparent / operations.tracestate"
        migration: "db/migrations/000006_operation_trace_context.sql"
        nullable: true
        rules:
          - "새 Operation을 등록할 때 현재 SaaS Span Context를 직렬화해 같은 transaction에 저장합니다."
          - "Worker는 저장된 Context를 복원하고 자신의 lifecycle을 가진 새 Span을 만듭니다."
          - "Idempotency replay는 원본 Context를 덮어쓰지 않고 Trace metadata를 request fingerprint에 넣지 않습니다."
          - "재시작/재처리에서는 새 Span ID를 사용하며 operation_id로 계속 대조합니다."
      failure_policy:
        fail_operation_on_invalid_context: false
        fail_operation_on_export_error: false
        collector_required_for_liveness_or_readiness: false
        rules:
          - "유효하지 않은 Context는 폐기하고 SaaS는 필요 시 새 Trace를 시작합니다. operation_id는 유지합니다."
          - "Exporter는 제한된 비동기 Queue·timeout을 사용하고 관측 장애로 업무 처리를 무기한 대기시키지 않습니다."
          - "Trace 전용 설정 오류는 안전한 진단 후 export를 비활성화하며 업무 필수 설정 검증과 구분합니다."
          - "종료 flush는 남은 shutdown budget 안에서만 수행하고 durable 업무 상태 저장을 우선합니다."
      note: >-
        D-25의 중앙 Trace 인수 검증은 유효한 Context와 수집 대상으로 선택된 실행을 기준으로 합니다.
        Span 이름·Sampling 비율·보존기간은 구현/플랫폼 검증에서 관리합니다.
        HTTP Span 종료는 비동기 Trace 연결의 종료가 아니며 HTTP request cancellation을 Worker 실행에 재사용하지 않습니다.
        Collector 장애·미수집·프로세스 crash 때 완전한 Trace를 보장하지 않습니다.
    metrics:
      examples:
        - "HTTP request count/latency/5xx"
        - "Operation stage/result/duration"
        - "Connector ONLINE/OFFLINE 및 heartbeat health"
        - "현재 WebSocket connection 수"
      allowed_label_examples:
        - service
        - component
        - operation_type
        - stage
        - result
        - environment
      forbidden_label_examples:
        - trace_id
        - request_id
        - operation_id
        - lab_instance_id
        - connector_id
        - terminal_session_id
        - live_session_id
        - preview_session_id

connector:
  network:
    outbound_only_to_saas: true
    public_saas_port: 443
    transport: "WSS/TLS"
    control_path: "/connector/v1/control"
    subprotocol: "labbit.connector.v1"
  config:
    LABBIT_WORKSPACE_ROOT:
      required_when: "Connector SFTP File boundary is configured"
      secret: false
      note: "VM 안의 canonical 절대 POSIX Workspace root입니다. 기본값은 없고 /는 금지하며 symlink root는 거절합니다. root의 부모/상위 디렉터리는 root 소유이고 group/other writable이면 안 됩니다. root 자체만 VM 관리 사용자에게 쓰기를 허용합니다."
    LABBIT_WORKSPACE_SFTP_HELPER:
      required_when: "LABBIT_WORKSPACE_ROOT is configured"
      secret: false
      note: "VM에 설치한 Linux labbit-workspace-sftp 실행 파일의 절대 경로입니다. executable과 상위 디렉터리는 root 소유이고 group/other writable이면 안 됩니다. 두 설정과 검증 가능한 Provider를 함께 주입하면 공유 VMAccess를 사용하는 WorkspaceFiles와 요청별 outbound File Data WSS를 구성하고 HELLO에 file-v1을 선언합니다. File endpoint는 LABBIT_SAAS_BASE_URL의 /connector/v1/file-data이며 production은 WSS와 서버 인증서 검증을 요구합니다."
    LABBIT_WORKSPACE_SFTP_HELPER_SOURCE_FILE:
      required: false
      secret: false
      note: "공식 Installer가 같은 release의 helper를 checksum 검증 후 저장하는 Connector 로컬 절대 파일 경로입니다. VM 목적지인 LABBIT_WORKSPACE_SFTP_HELPER와 다릅니다. SHA256과 VM 경로 두 값을 함께 설정하면 Provision/Reset은 cloud mutation 및 Reset 삭제 전에 최대 32MiB regular readonly ELF Linux amd64 artifact와 digest를 검증하고, Workspace VM의 cloud-init 완료 후 기존 management SSH pin/소유권 검증을 거쳐 helper/root를 준비합니다. VM Internet Outbound나 user_data 변경을 요구하지 않습니다. source와 digest 둘 다 없으면 기존 image/manual 준비 모드를 유지합니다."
    LABBIT_WORKSPACE_SFTP_HELPER_SHA256:
      required_when: "LABBIT_WORKSPACE_SFTP_HELPER_SOURCE_FILE is set"
      secret: false
      note: "Connector 로컬 helper artifact의 SHA256 hex digest입니다. 공식 Installer가 release SHA256SUMS와 다운로드 bytes를 검증해 저장합니다. helper는 root-owned 0755, workspace root는 non-root SSH 계정 소유0750으로 생성하며 같은 digest/안전한 기존 root만 재사용하고 다른 helper나 symlink/불안전 권한은 덮어쓰지 않고 실패합니다. sudo -n python3, runuser, Linux amd64 이미지를 요구하며 실패/불명은 Provider 성공으로 처리하지 않습니다."
    LABBIT_SAAS_BASE_URL:
      required: true
      secret: false
      note: "HTTPS base URL입니다. WSS endpoint는 Git Connector Contract를 기준으로 파생합니다."
    LABBIT_CONNECTOR_ID:
      required: true
      secret: false
    LABBIT_CONNECTOR_CREDENTIAL_FILE:
      required: true
      secret: false
      note: "파일에는 Connector Credential 원문이 들어 있으며 고객 환경 Secret 경계 안에 유지해야 합니다."
    LABBIT_PROVIDER_CONFIG_FILE:
      required_when: "OpenStack Provider operations are enabled"
      secret: false
      note: >-
        고객 환경에만 존재하는 Provider 설정 파일 경로입니다. 파일에 OpenStack Credential이
        포함될 수 있으며, 내용은 중앙 SaaS나 log로 보내지 않습니다.
        KT D1의 auth_url=https://api.ucloudbiz.olleh.com/d1/identity/는 버전 검색 없이
        Keystone v3 토큰 API를 사용하며 Compute/Image는 공식 Gateway Endpoint를 사용합니다.
        이 Endpoint 호환 처리는 Neutron과 KT Tier를 같은 API로 간주하지 않습니다.
    OS_CLOUD:
      required_when: "OpenStack Provider operations are enabled"
      secret: false
      note: "LABBIT_PROVIDER_CONFIG_FILE 안에서 사용할 OpenStack cloud 이름입니다."
    LABBIT_PROVIDER_CONNECTION_ID:
      required_when: "OpenStack Provider operations are enabled"
      secret: false
      note: "이 Connector 설정이 담당하는 SaaS ProviderConnection ID이며 CreationSnapshot의 연결 affinity를 검증합니다."
    OS_PROJECT_ID:
      required_when: "OpenStack Provider operations are enabled"
      secret: false
      note: "Nova/Neutron quota preflight에 사용하는 현재 Provider project ID입니다."
    LABBIT_OPENSTACK_MANAGEMENT_NETWORK_ID:
      required_when: "standard Neutron OpenStack profile"
      secret: false
      note: >-
        표준 Neutron 관리망은 IPv4 DHCP subnet 한 개이며 Connector SSH CIDR 전체가
        그 subnet에 직접 연결되어야 합니다. Lab CIDR과 겹치거나 명시적 host route가
        있거나 routed Connector/IPv6 관리망인 구성은 Provision/Reset preflight에서 거절합니다.
        관리망 DHCP는 Neutron만 제공해야 하며 VMware 등 외부 DHCP와 경쟁하는 배포는 지원하지 않습니다.
        extra_dhcp_opt 확장이 필요하며 생성한 Management port에만 IPv4 DHCP 옵션
        router(3)의 빈값과 classless-static-route(121)의 검증한 Management CIDR,0.0.0.0 직접 연결 경로를
        설정·확인합니다. 유효한 121을 받은 Linux DHCP client가 option 3을 무시하여 default route 경쟁을 막습니다.
        공유 subnet/SG와 CreationSnapshot StartupScript는 변경하지 않습니다.
        249 옵션의 빈값은 Neutron이 지원하지 않으므로 요청하지 않습니다.
        지원 배포·이미지는 유효한 121을 실제 적용하고 249에 의존하지 않는 검증된 dnsmasq/Linux 구성이며
        Lab NIC의 metadata 경로, cloud-init 및 DHCP 갱신 후 ON/OFF·관리 SSH 검증이 필요합니다.
        guest static route와 검증되지 않은 DHCP backend는 이 지원 범위에 포함하지 않습니다.
    LABBIT_OPENSTACK_MANAGEMENT_SECURITY_GROUP_ID:
      required_when: "standard Neutron OpenStack profile"
      secret: false
      note: "D-18의 ProviderConnection 공용 Management SG입니다. stateful이어야 하며 Connector CIDR의 TCP/22 ingress 한 개만 허용하고 egress rule은 없어야 합니다."
    LABBIT_OPENSTACK_EXTERNAL_NETWORK_ID:
      required: false
      secret: false
      note: "CreationSnapshot.internetOutbound=true일 때 필수이며 generation별 Lab Router의 external gateway입니다."
    LABBIT_OPENSTACK_KEYPAIR_NAME:
      required_when: "OpenStack Provider operations are enabled"
      secret: false
      note: "D-18의 Connector 전용 공용 Ed25519 관리 keypair 이름입니다. 설치/등록 단계가 생성한 public key를 Nova에 등록하며, Lab Provision/Reset/Cleanup은 이 keypair를 생성·회전·삭제하지 않고 local private key와의 일치만 검증합니다."
    LABBIT_OPENSTACK_SSH_ALLOWED_CIDR:
      required_when: "OpenStack Provider operations are enabled"
      secret: false
      note: "Connector의 SSH 접근만 허용하는 IPv4 CIDR입니다. 표준 OpenStack은 공용 Management SG에 사용하고 KT D1은 Connector Tier 안의 Connector 주소 /32를 NSM 정책 source로 사용합니다."
    LABBIT_KTCLOUD_CONNECTOR_TIER_ID:
      required_when: "KT D1 auth_url profile"
      secret: false
      note: "Connector VM이 연결된 공유 NSM Tier UUID(networkId)입니다. refId나 기존 Management Network 변수에 넣지 않습니다. Lab lifecycle은 이 Tier를 생성·삭제하지 않습니다."
    LABBIT_KTCLOUD_MANAGEMENT_CIDR:
      required_when: "KT D1 auth_url profile without LABBIT_KTCLOUD_CIDR_PAIRS"
      secret: false
      note: "Lab VM 전용 Management Tier에 사용할 미사용 IPv4 /24입니다. Lab CIDR 및 기존 Tier와 겹치면 생성 전에 거절합니다. 현재 KT D1 호환 범위는 Python3·cloud-init·Netplan·systemd-networkd를 제공하는 Ubuntu Linux 이미지, 50 GiB 부팅 볼륨, VM 한 대, internetOutbound=false이며 표준 Neutron Management/SG/External Network 변수는 비워야 합니다. 관리 NIC의 Netplan ID는 실제 인터페이스 이름과 같아야 하며 networkctl status --json=short의 활성 NetworkFile이 /run/systemd/network/*netplan*.network이고 별도 drop-in이 없어야 합니다. 별도 cloud-init boothook이 정확한 관리 NIC에 Connector /32 반환 경로를 관리 gateway(.1)로 영속 선언하고 networkd에 반영합니다. 사용자 StartupScript는 별도 MIME part로 보존하며 합성·압축된 최종 base64 user_data 2048 byte 한도를 Provision 및 Reset 삭제 전에 검사합니다. StartupScript가 없어도 cloud-init 완료와 소유 overlay·활성 NetworkFile의 Route·실제 /32 및 source별 반환 경로를 인증된 SSH로 검증해야 READY입니다."
    LABBIT_KTCLOUD_CIDR_PAIRS:
      required: false
      secret: false
      note: 'KT D1 선택 모드: [{"lab":"172.25.240.0/24","management":"172.25.241.0/24"}] 형식의 JSON 배열, 1~64쌍. 모든 CIDR은 canonical private IPv4 /24이고 풀 전체에서 비중첩이어야 합니다. 예시는 승인된 운영 설정이 아닙니다. 단일 Connector가 독점하는 풀만 지정하고 다른 프로세스/운영자의 해당 대역 할당을 금지합니다. 기존 Tier 전체 조회와 로컬 영속 예약을 대조하며 RESET generation과 무관하게 LabInstance별 예약을 재사용합니다.'
    LABBIT_KTCLOUD_CIDR_STATE_DIR:
      required_when: "LABBIT_KTCLOUD_CIDR_PAIRS is set"
      secret: false
      note: "Connector 사용자 소유의 기존 absolute 0700 영속 디렉터리. 풀/Project/ProviderConnection binding, Instance 예약, generation별 mutation intent와 확정 결과의 전체 exact-ID completion을 0600 파일로 동기화합니다. 동일 풀의 모든 실행은 이 디렉터리를 공유해야 하며 복제/초기화/임시 디스크 사용을 금지합니다. Cleanup 성공 후 모든 intent의 완전한 completion(SERVER마다 같은 generation의 root-volume ID 포함), 모든 generation exact-ID 부재 및 전체 Tier inventory의 CIDR 부재를 확인하면 동일 LOCK 안에서 자동 반환합니다. 이전 소유자·쌍·Cleanup correlation·completion을 immutable retired 파일로 먼저 fsync하고 active 원장을 제거·directory fsync하며 지연된 이전 소유자 명령을 차단합니다. RESET 내부 삭제는 반환하지 않습니다. UNKNOWN·구버전 intent·누락된 root ID·불완전 조회는 예약을 보존합니다. 파일 상한 32 KiB를 초과하는 반환 이력도 보존 없이 반환하지 않습니다. 반환 중단·원장 손상·stale LOCK은 자동 회수하지 않으며 exact-ID Reconcile과 독점 실행 확인 후 운영자 복구가 필요합니다. 설정 오류·풀 소진·잠금 충돌 등 mutation 미시도와 이전 불확실성 부재가 확인된 사전 거절은 FAILED, 이전 부작용을 배제할 수 없으면 UNKNOWN/HOLD입니다. 구버전 Provision/RESET이 새 completion/retired 파일에서 HOLD하더라도 Cleanup은 원장을 확인하지 않고 전달된 exact-ID에 DELETE를 시도할 수 있습니다. rollback 전 Cleanup을 포함한 mutation dispatch와 Connector writer를 중지하고 CIDR 원장·DB ProviderResource·실제 Provider exact-ID·전체 Tier inventory를 대조한 뒤 운영자 판단으로 재개합니다."
    LABBIT_OPENSTACK_LAB_SUBNET_CIDR:
      required_when: "OpenStack Provider operations are enabled on standard OpenStack or KT D1 without LABBIT_KTCLOUD_CIDR_PAIRS"
      secret: false
    LABBIT_OPENSTACK_SSH_USERNAME:
      required_when: "OpenStack Provider operations are enabled"
      secret: false
      default: "ubuntu"
      note: "D-18의 Connector→VM SSH Ready 확인에 필수입니다. 이미지에 맞는 관리 사용자 이름이며 Terminal 사용자 입력과 분리합니다."
    LABBIT_OPENSTACK_SSH_PRIVATE_KEY_FILE:
      required_when: "OpenStack Provider operations are enabled"
      secret: true
      note: "D-18에 따라 Connector 설치/등록 단계가 생성한 Ed25519 관리 private key 파일 경로입니다. 파일은 Connector 로컬 Secret 경계에만 두고 log/중앙 SaaS로 보내지 않습니다."
    LABBIT_OPENSTACK_SSH_KNOWN_HOSTS_FILE:
      required_when: "production terminal sessions or VM access operations are enabled"
      secret: false
      note: "모든 Provision의 SSH Ready 확인 및 VM SSH Host Key 검증용 known_hosts 파일 경로입니다. 동적 VM host key를 ProviderConnection+Server ID 단위 TOFU로 고정하고 이후 불일치를 거부하는 Connector 로컬 파일 경로입니다. 프로덕션 환경에서 필수입니다."
    LABBIT_LOG_LEVEL:
      required: false
      secret: false
      default: "info"
    LABBIT_OPENSTACK_SSH_IDLE_TIMEOUT:
      required: false
      secret: false
      default: "1m"
      note: "VM별 공유 SSH Connection에 열린 PTY/SFTP/Preview TCP forwarding Channel이 없을 때 종료까지의 시간입니다. 양수 Go duration만 허용하며 TerminalSession의 PTY grace와 독립입니다."
  heartbeat:
    interval: "15s"
    saas_offline_after: "45s"
    note: "값은 Connector wire decision에서 정의하며 configurable하게 유지합니다."
  observability:
    log_format: "JSON object per line"
    central_raw_log_shipping_required: false
    central_raw_metric_shipping_required: false
    central_raw_trace_shipping_required: false
    tracing:
      mode: "propagation-only"
      propagation: "W3C Trace Context"
      central_export_enabled: false
      wire_contract: "contracts/connector/README.md#9-공통-correlation"
    note: >-
      SaaS는 Control WSS를 통해 이미 수신하는 metadata를 중앙에서 관측합니다.
      Connector는 명령별 Context를 ACK/PROGRESS/RESULT와 로컬 로그까지 유지하며
      중앙 OTLP 연결/인증/exporter를 추가하지 않습니다. OpenStack 내부 상세 Span은 중앙 수집하지 않습니다.
      raw log/metric/trace는 중앙 상시 반출하지 않고 필요할 때 동일 correlation ID로 로컬 로그를 대조합니다.

frontend:
  runtime:
    output: "Vite static production build"
    server_side_rendering_required: false
    rules:
      - "Frontend build/runtime 설정에 Secret을 포함하지 않습니다."
      - "환경별 public URL/configuration은 플랫폼이 제공할 수 있습니다."
      - "HTTP/WSS 동작은 deployment topology가 아니라 Git OpenAPI와 realtime contract를 따릅니다."

platform_responsibilities:
  - "immutable application/container artifact를 build하고 version을 식별합니다."
  - "Secret 값을 Git에 commit하지 않고 secret/non-secret configuration을 주입합니다."
  - "승인된 public HTTPS/WSS 443 route를 application listener에 연결합니다."
  - "admin listener를 cluster/operations 경계 안에 비공개로 유지합니다."
  - "/livez와 /readyz를 기준으로 Kubernetes probe를 구성합니다."
  - "/metrics를 public에 노출하지 않고 scrape합니다."
  - "role별 검증 후 Helm/IaC에서 replica/HPA/workload 경계를 결정합니다."
  - "LABBIT_SHUTDOWN_GRACE를 connection draining 및 terminationGracePeriodSeconds와 조정합니다."
  - "application rollout 전에 labbit-migrate up을 별도의 deployment/CI step으로 한 번 실행합니다."
  - "D-23/D-25 민감정보 규칙에 따라 stdout/stderr JSON log를 수집합니다."
  - "SaaS에만 OTLP endpoint/protocol과 필요한 header·CA·mTLS certificate/key 입력을 Secret/file mount로 주입하고 Collector·Trace 저장/조회 경로를 운영합니다."
  - "Trace 수집 검증 환경에서 otlp export를 활성화하고 Sampling·보존·비용·Log correlation을 개발팀과 검증합니다."
  - "RDS connectivity, backup/restore, DR, DNS/TLS, deployment rollback을 관리합니다."

non_guarantees:
  - >-
    이 contract는 application, Kubernetes deployment, database migration,
    graceful shutdown 또는 multi-replica routing이 이미 구현·검증되었다고 주장하지 않습니다.
  - >-
    v0.1.1의 Trace 설정/전파 계약은 OTel SDK 초기화, OTLP exporter, Operation Context 저장/복원,
    Connector propagation 또는 Tempo E2E가 이미 구현·검증되었다는 뜻이 아닙니다.
  - >-
    shutdown duration, replica count, HPA threshold, load-balancer timeout처럼 platform/integration
    validation에 맡긴 값은 API compatibility guarantee가 아닙니다.
