server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 백엔드 API 경로 SPA fallback 대상 제외 (404 반환)
    location /api/v1 {
        return 404;
    }

    # React SPA 라우팅 fallback (/login 등으로 직접 접속 시 404 방지)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 헬스체크용 엔드포인트
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
